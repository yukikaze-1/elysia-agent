name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "character/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "character/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# 信任边界（P0-02，2026-08-10）：
#   - pull_request 可达的 job 一律 GitHub-hosted（一次性、无宿主 secret、无持久
#     工作区），且不得引用宿主绝对路径凭据。恶意 PR 无法在持久 self-hosted
#     runner 上读取宿主 .env / API key / 执行任意代码。
#   - push 到 main（受信 ref）才允许 self-hosted + 宿主 Elysia env + 真实 .env。
#   - 策略由 scripts/check_ci_isolation.py 静态强制（PR 可达 job 禁止
#     self-hosted、禁止 /home/.../.env 引用）；违规即 CI 红。
#   - 真实凭据外部 E2E（workflow_dispatch + environment）由 F1/E4 拆分，仅受信 ref。
# ---------------------------------------------------------------------------

jobs:
  pr-gate:
    name: PR Gate (backend lint + types + contract + quick)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime + dev deps (clean-room, 无真实凭据)
        # CPU-only torch 快速安装（CUDA/GPU 只在受信 push job）；一次全新安装，结果确定
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt pytest ruff pyright
      - name: Lint (import style gate)
        run: python -m ruff check core/ Module/ frontend_contract/ --exclude __pycache__
      - name: Pyright (type check gate)
        run: python -m pyright
      - name: Contract drift check
        run: |
          python -m frontend_contract --check
          python scripts/gen_contract_frames.py --check
      - name: CI trust boundary check
        run: python scripts/check_ci_isolation.py
      - name: Run quick tests (unit + service, 无外部 key)
        run: python -m pytest -m "unit or service" -q -x --tb=short --ignore=Module/workflow_engine/tests

  # ---- push 到 main（受信 ref）：复用 self-hosted Elysia env，真实 .env ----
  quick:
    name: Quick (unit + service)
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout (retry x4)
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          # self-hosted runner 到 github.com 网络抖动时重试；HTTP/1.1 由 runner 全局 git config 保证
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            rm -rf ./* ./.git 2>/dev/null || true
            if git init -q . &&
               git remote add origin "$REPO_URL" &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Load .env
        # 仅受信 push ref——不受信 PR 永不进入本 job（if guard + 门禁脚本双保险）
        run: cp /home/yomu/elysia-agent/.env .env
      - name: Setup conda env (Elysia)
        # self-hosted runner 默认 shell 无 conda——把 Elysia env 的 bin 加入 PATH，
        # 使 ruff/pytest/python 可解析（等价 conda activate Elysia）
        run: echo "/home/yomu/miniconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Lint (import style gate)
        run: make lint
      - name: Pyright (type check gate, 全仓生产代码)
        run: make pyright
      - name: Contract drift check
        run: make check-types
      - name: Run quick tests
        run: |
          set -a
          source .env
          set +a
          make test-quick
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  normal:
    name: Normal (not slow)
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout (retry x4)
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          # self-hosted runner 到 github.com 网络抖动时重试；HTTP/1.1 由 runner 全局 git config 保证
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            rm -rf ./* ./.git 2>/dev/null || true
            if git init -q . &&
               git remote add origin "$REPO_URL" &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Load .env
        # 仅受信 push ref——不受信 PR 永不进入本 job
        run: cp /home/yomu/elysia-agent/.env .env
      - name: Setup conda env (Elysia)
        # self-hosted runner 默认 shell 无 conda——把 Elysia env 的 bin 加入 PATH，
        # 使 ruff/pytest/python 可解析（等价 conda activate Elysia）
        run: echo "/home/yomu/miniconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Lint (import style gate)
        run: make lint
      - name: Run normal tests
        run: |
          set -a
          source .env
          set +a
          make test-normal
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  frontend:
    name: Frontend (vue-tsc + build)
    # 无需宿主 secret / self-hosted——GitHub-hosted 即可安全构建 v1 UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Frontend type-check + build
        run: cd frontend && npm run build
