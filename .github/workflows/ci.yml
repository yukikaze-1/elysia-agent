name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # 2026-09-14（CI 性能专项）：这里**只**保留证明确实不被任何测试/gate 读取的路径。
      # 此前还忽略 `**.md` 与 `character/**`，但两者都会被测试读：
      #   - `core/tests/test_doc_counts.py`（unit）断言 `CLAUDE.md` 与 `core/README.md`
      #     的内容——只改 Markdown 的 push 会让 main 上的 CI 静默变红（改了文档
      #     里那几个可数事实，却因为 paths-ignore 根本不触发任何 workflow）；
      #   - `character/**/config.yaml` 被 `core/prompt/tests/conftest.py:76`、
      #     `core/prompt/tests/test_system_prompt_snapshot.py:91`、
      #     `Module/config/tests/test_preflight.py`、`core/tests/test_phase3.py` 读取。
      # `docs/**` 保留：没有测试在**运行期**读 docs/。⚠️ 但**门禁**会读——
      #   - golden frames `docs/archive/frontend-handoff-v2/traces/**`（由
      #     contract-frames.yml 单独覆盖）；
      #   - `docs/electron-backend-protocol-v2.md` 被 `scripts/check_error_codes.py`
      #     读取（`make check-types` 的第三条命令）——**2026-09-20 才补进
      #     contract-frames.yml 的 paths**。此前"只改协议文档"的提交既不走 ci.yml
      #     （本 ignore）也不走那个 workflow（paths 不含它）⇒ 该检查零执行点。
      #   新增任何"读 docs/ 的门禁"时，必须同步把被读文件加进 contract-frames.yml
      #   的 paths，或从本 ignore 里摘掉它。
      - "docs/**"
  # ⚠️ **2026-09-16 起不再监听 pull_request**（本仓当前不开放 PR）。要恢复 PR 门禁，
  # 见下面「PR 门禁（已移除）」小节列的清单——不是把这几行加回来就完事。

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 最小权限：全仓只需读代码（自托管 checkout 用 github.token 拉取同样只需 contents:read）。
# 此前无 permissions 块 → 继承仓库默认（可能是 read/write）。
permissions:
  contents: read

# ---------------------------------------------------------------------------
# 信任边界（P0-02，2026-08-10）：
#   - pull_request 可达的 job 一律 GitHub-hosted（一次性、无宿主 secret、无持久
#     工作区），且不得引用宿主绝对路径凭据。恶意 PR 无法在持久 self-hosted
#     runner 上读取宿主 .env / API key / 执行任意代码。
#   - push 到 main（受信 ref）才允许 self-hosted + 宿主 Elysia env + 真实 .env。
#   - 策略由 scripts/check_ci_isolation.py 静态强制（PR 可达 job 禁止
#     self-hosted、禁止 /home/.../.env 引用、禁止 if 守卫引用未声明事件、
#     runs-on 必须可静态判定为 GitHub-hosted、self-hosted 清理必须密闭且受守卫）；
#     违规即 CI 红。
#   - 真实凭据外部 E2E 已移出本 workflow（见下），只在 `.github/workflows/nightly.yml`
#     的受信手动触发里跑。
#
# 2026-09-16（PR 门禁移除）：本仓当前**不开放 PR**，故删掉两个 pull_request
#   可达的 job（`pr-gate`、`frontend-pr`）并去掉 `pull_request` 触发器。触发原因是
#   账单：GitHub 账号额度/账单被卡后**托管 runner 上的 job 根本不会被分发**，这类
#   job 会在 0～3 秒内"失败"（注解原文："The job was not started because recent
#   account payments have failed or your spending limit needs to be increased"），
#   而它**与代码无关**——给每次运行挂一个无意义的红叉，比没有这个 job 更糟：
#   它训练人忽略红色，而本仓的门禁文化正是靠"红=有事"支撑的。
#   （2026-09-14 frontend 批次已因同一原因踩过一次，见 git 历史。）
#
#   ### 开放 PR 时
#   **不是把 `pull_request` 加回来就完事**——完整清单（两个待恢复的 job、PR 侧必须
#   GitHub-hosted 的理由、分支保护 required check 的陷阱、恢复后要跑的门禁）见
#   **`docs/ci.md`**（CI 的唯一权威说明）。本文只留一句提醒：
#   required status check 按 **job 名**匹配、且只在 PR 上评估，`Frontend (vue-tsc + build)`
#   与 `Real MongoDB (storage layer)` 现在都不在 PR 侧上报——不对齐会让 PR 永远等不到上报。
# ---------------------------------------------------------------------------

jobs:
  # ---- push 到 main（受信 ref）：复用 self-hosted Elysia env，真实 .env ----
  #
  # 单一 backend job（2026-09-14 CI 性能专项）。此前是并列的 `Quick` + `Normal`
  # 两个 job，看似可并行，实际不能：
  #   ① 本仓库只注册了 **1 个** self-hosted runner（`elysia-server`，
  #      `/home/yomu/actions-runner/.runner`；其余三个 runner 属于
  #      `yukikaze-1/elysia-frontend`，不接本仓库的 job）。一个 runner 同时只跑一个
  #      job —— runner 自己的诊断日志显示 Normal 恒在 Quick 结束后 4–13s 才启动
  #      （2026-09-13 19:12:13→19:23:06 = 10m53s，两段严格串行）。
  #   ② `Quick`(`-m "unit or service"`) ⊆ `Normal`(`-m "not slow and not external"`)，
  #      4912/4986 = **98.5% 的 Normal 是 Quick 的逐字重复**——同一批用例被跑了两遍。
  #      而 `Quick` 里唯一的"独有"内容是静态门禁（26s），与测试集合无关。
  # 合并后：静态门禁只跑一次、离线用例只跑一遍、xdist 并行。
  backend:
    name: Backend (static gates + offline suite)
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout (retry x4, hermetic clean)
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          # self-hosted runner 到 github.com 网络抖动时重试；HTTP/1.1 由 runner 全局 git config 保证
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            # **密闭清理**：删掉 $GITHUB_WORKSPACE 的每一个直接子项，含 dotfile/dotdir。
            # 旧写法 `rm -rf ./* ./.git 2>/dev/null || true` 有两个缺陷（实测于
            # /home/yomu/actions-runner/_work/elysia-agent/elysia-agent）：
            #   ① shell glob `*` 不匹配前导点 → `.env` / `.pytest_cache` / `.ruff_cache`
            #      / `__pycache__` / `.model_cache` 全部跨 job 残留（该工作区里
            #      `.pytest_cache` 目录 mtime 还是 2026-08-02，而 lastfailed 是 09-14 写的）；
            #   ② `|| true` 把真实失败也吞掉——若 `.git` 侥幸留下，`git remote add` 会以
            #      "already exists" 失败，四次重试全部同样失败却把原因归给网络。
            # find 形式对空目录、dotfile、非常规文件名都正确，且只作用于 workspace 自身。
            WS="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE 未设置——拒绝在未知目录下清理}"
            if [ "$WS" = "/" ]; then
              echo "FATAL: GITHUB_WORKSPACE 解析为 / ——拒绝清理"
              exit 1
            fi
            # fail-closed：**显式**检查清理的退出码。实测 `find … -exec rm -rf -- {} +`
            # 会把 rm 的失败传播成自己的非零退出（rm 返回 1 → find 退出 1），所以这一条
            # 真能拦住「清理没做完」。不检查的话失败被静默忽略、脚本继续在**未清空的
            # 持久 workspace** 上 fetch+checkout——而下面的 `Load .env` 明确依赖
            # 「workspace 已清空」（残留的宿主 .env 会跨 job 泄漏）。
            # 刻意不用 `set -e`：那会改变本 retry loop 的控制流（`git remote add` 撞已有
            # origin、`git fetch` 网络抖动都是「允许失败」的命令；详见 nightly 同段注释）。
            if ! find "$WS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
              echo "FATAL: workspace 清理失败（$WS 未清空）——拒绝在残留目录上继续"
              exit 1
            fi
            if git init -q . &&
               (git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL") &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Load .env
        # 仅受信 push ref——不受信 PR 永不进入本 job（if guard + 门禁脚本双保险）。
        # 上一步已把 workspace 清空，所以这里的 .env 一定是本 job 从宿主重新取的，
        # 不存在上一个 job 残留的 .env。
        run: cp /home/yomu/elysia-agent/.env .env
      - name: Setup conda env (Elysia)
        # self-hosted runner 默认 shell 无 conda——把 Elysia env 的 bin 加入 PATH，
        # 使 ruff/pytest/python 可解析（等价 conda activate Elysia）
        run: echo "/home/yomu/data/anaconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Lint (import style gate)
        run: make lint
      - name: Pyright (type check gate, 全仓生产代码)
        run: make pyright
      - name: Contract drift check
        run: make check-types
      - name: Architecture boundary check (ARCH-INC-P1-03)
        run: make check-arch
      - name: Timeout budget check (#47 ①)
        run: make check-timeouts
      - name: Contract reachability check (#47 ②)
        run: make check-contract
      - name: Debug frontend auth guard (S2-F3)
        run: make check-debug-auth
      - name: CI trust boundary check (P0-02)
        # 此前只在 PR Gate 跑 → 直接 push 到 main 的提交从未被校验过信任边界。
        # 纯静态解析、<1s。
        run: make check-ci-isolation
      # 2026-09-20：文档守卫必须**接在这里**（而不是只留在 Makefile）——
      # 它读 docs/ 下的 canonical 文档，而本 workflow 带 `paths-ignore: docs/**`：
      # 纯文档提交不会触发本 job（那是刻意的），但**契约/代码**提交会触发，
      # 那时若文档已被改坏，这条门禁就是唯一能发现它的地方。
      # 纯文档提交的覆盖由 contract-frames.yml 的 paths 补（见该文件）。
      - name: Documentation drift guard (DG1-DG5)
        run: make check-docs
      - name: Secret scanning (CR-01)
        # 同上：此前只在 PR Gate 跑 → 直接 push 到 main 的提交不会被扫凭据形态。
        # 纯 stdlib、秒级。
        run: make check-secrets
      - name: Test set algebra gate (Quick ∪ remainder == Normal)
        # 保证 make test-quick / test-remainder 仍然互斥且不遗漏；约 35s（3 次收集）。
        run: make check-test-sets
      - name: Compose security policy check (P1-19)
        # 2026-09-16：此前**从未**接过任何 CI（只在本地手跑）——声明了却不执行的
        # 门禁与不存在的门禁，在给人虚假安全感上是等价的。纯静态解析、~0.1s。
        run: make check-compose
      - name: Env lock drift check (F2)
        # 2026-09-16：本步此前**只**在已删除的 PR job 里跑（删 PR 时被一并带走，
        # 无人察觉）——锁与声明漂移会让"从锁建 env"与"按声明装包"得到两个环境。
        # 纯 stdlib、~0.1s。
        run: make check-env-lock
      - name: Dependency & static security scan (F2)
        # 2026-09-16 接线（§0.4.31 #10）：此前登记在 check-ci-isolation 的
        # `_GATES_NOT_IN_CI`——理由是 env 的 pip 26.1.2 自身命中 PYSEC-2026-3721，
        # 接线会让 main 因与本仓提交无关的原因变红。升级 pip 26.2.1 + 重生成
        # environment.lock.yml 后判据成立，故删除豁免并接在这里。
        # 判据：pip-audit 0 项未豁免漏洞；bandit **Medium 及以上 0 项**（Low 19 项
        # 为已知基线，见 CODE_REVIEW_REPORT.md 残余清单）。
        run: make audit
      - name: Run offline suite (not slow and not external, xdist)
        # 完整离线集**只跑一遍**（此前 Quick + Normal 把 98.5% 的用例跑了两遍）。
        run: |
          set -a
          source .env
          set +a
          make test-normal
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ---- Frontend：唯一一处 push / PR 必须分流的 job（2026-09-14）---------------
  #
  # 为什么必须拆成两个 job 而不是一个加 `if:`：Frontend 是**两条路径都需要**的
  # 检查，而两条路径的 runner 归属相反——
  #   push（受信 ref）→ self-hosted：摆脱账单导致的「job 无法启动」；
  #   PR（不受信）    → GitHub-hosted：`npm ci` 会执行依赖包的 postinstall 脚本，
  #                     在持久 trusted runner 上等价于让 PR 作者以宿主用户 yomu
  #                     执行任意代码。
  # 单个 job 无法同时满足（`runs-on` 不支持按事件静态分流，而表达式形式的
  # `runs-on` 恰恰是 scripts/check_ci_isolation.py 现在会**拒答**的形态）。
  # 所以：两个 job、同一套 npm 步骤，`scripts/check_ci_isolation.py` 机械保证
  # 「PR 侧永不 self-hosted」。
  #
  # 命名（刻意，勿"顺手统一"）：**PR 侧沿用原名** `Frontend (vue-tsc + build)`。
  # 分支保护的 required status check 是按 job 名匹配的，且只在 PR 上评估——
  # 把名字挪到 push 侧会让已配置的 required check 永远等不到上报，PR 卡死。
  # push 侧因此取带后缀的新名。
  #
  # 为什么 push 侧不用 `actions/checkout` + `actions/setup-node`：
  #   ① checkout 必须密闭（self-hosted workspace 跨 job 持久），复用 backend job
  #      同一套清理方案；② 宿主已用 nvm 预装 Node — 见下面 "Pin Node" 步骤。
  # ---- Real MongoDB：push-only + self-hosted（2026-09-16 从 GitHub-hosted 迁入）----
  #
  # 为什么迁：`ubuntu-latest` 按分钟计费，而账户额度一旦见底，**job 根本不会启动**
  # （实测 annotation 原文："The job was not started because recent account payments
  # have failed or your spending limit needs to be increased"）。那比没有这个 job 更糟
  # ——它给每个 push/PR 挂一个**与代码无关的红叉**，训练人忽略红色。与 frontend job
  # 同一处置（见上面那段注释：push → self-hosted「摆脱账单导致的 job 无法启动」）。
  #
  # 为什么是 **push-only**：本层是 `external` 档（marker `real_mongo` 既不在 Quick
  # 也不在 Normal，任何档位默认都不跑），合入后的覆盖足够；而 PR 侧要保留覆盖就**必须**
  # 留在 GitHub-hosted——不受信 PR 代码不得落在持久 runner 上，`scripts/check_ci_isolation.py`
  # 会直接拒答。这条 `if:` 正是该门禁判定「受信 push job」的依据，**不要把 `pull_request`
  # 加回来**（加了它这一整段就会变成违规）。
  #
  # ⚠️ **迁移后必须检查分支保护**：required status check 按 **job 名**匹配，且只在 PR 上
  # 评估。若 `Real MongoDB (storage layer)` 被勾成 required，push-only 之后 PR **永远等不到
  # 它上报** → 所有 PR 卡死。请先在 Settings → Branches 取消勾选（frontend 那对 job 就是
  # 为同一个坑而刻意保留 PR 侧原名，见上文命名说明）。
  #
  # 数据服务不再用 `services:`（那是 GitHub-hosted 的能力），改为 job 内自己起
  # `docker-compose.test.yml`——与本地 `make test-real-mongo` **完全同一条路**：
  # 端口只绑 127.0.0.1:27018、无 volume、跑完 `down` 归零。
  # 为什么必须等 healthy 再跑：`RUN_REAL_MONGO_TESTS=1` 的语义是"**连不上就 fail**"，
  # 但"容器还没起来"会把 fail 变成一串连接错误——先等健康，等不到就 fail-closed 退出
  # （绝不退化成 skip，那正是"环境不满足"型假绿）。
  real-mongo:
    name: Real MongoDB (storage layer)
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout (retry x4, hermetic clean)
        # 与 backend / frontend job **同一套** checkout + 密闭清理方案（不另造第三套 shell）：
        # 写法理由（为什么 find 而不是 glob、为什么不用 `set -e`）见 backend job 同段注释。
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            WS="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE 未设置——拒绝在未知目录下清理}"
            if [ "$WS" = "/" ]; then
              echo "FATAL: GITHUB_WORKSPACE 解析为 / ——拒绝清理"
              exit 1
            fi
            # fail-closed：显式检查清理退出码（`set -e` 不算，理由见 backend job）
            if ! find "$WS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
              echo "FATAL: workspace 清理失败（$WS 未清空）——拒绝在残留目录上继续"
              exit 1
            fi
            if git init -q . &&
               (git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL") &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      # 本 job **刻意不加载 .env**：真实 MongoDB 测试层只需要 `ELYSIA_TEST_MONGODB_URI`
      # 指向本地一次性容器，零凭据（与 frontend job 同一取舍：少一个 .env 就少一条外泄路径）。
      - name: Setup conda env (Elysia)
        run: echo "/home/yomu/data/anaconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Start test MongoDB (compose, loopback only)
        shell: bash
        run: |
          set -uo pipefail
          if ! docker compose -f docker-compose.test.yml up -d; then
            echo "FATAL: 测试 Mongo 容器启动失败"
            exit 1
          fi
          state=unknown
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' elysia-mongo-test 2>/dev/null || echo missing)
            if [ "$state" = "healthy" ]; then
              echo "elysia-mongo-test healthy"
              exit 0
            fi
            sleep 2
          done
          echo "FATAL: elysia-mongo-test 未在 60s 内 healthy（当前状态=$state）——拒绝继续"
          docker logs elysia-mongo-test 2>&1 | tail -30 || true
          exit 1
      - name: Run real MongoDB layer (marker real_mongo)
        env:
          ELYSIA_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/elysia_test
        run: make test-real-mongo
      - name: Teardown test MongoDB (always, fail-closed)
        # 三层用意：① `always()` —— 用例失败也要收摊，否则下一次运行撞端口/留残留；
        # ② **显式检查退出码**（`set -e` 不算，与 workspace 清理同一条纪律）；
        # ③ 再断言容器**确实没了**——`down` 返回 0 不等于清理生效（容器可能因
        #    `--remove-orphans` 之外的缘故残留），残留会污染下一次运行。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if ! docker compose -f docker-compose.test.yml down --remove-orphans; then
            echo "FATAL: 测试 Mongo 容器清理失败——会污染下一次运行"
            exit 1
          fi
          leftover=$(docker ps -a --filter name=elysia-mongo-test --format '{{.Names}}')
          if [ -n "$leftover" ]; then
            echo "FATAL: elysia-mongo-test 仍存在（清理未生效）：$leftover"
            exit 1
          fi

  frontend:
    name: Frontend (vue-tsc + build, self-hosted)
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout (retry x4, hermetic clean)
        # 与 backend job **同一套** checkout/清理方案（不另造第二套 shell）：
        # 密闭清理含 dotfile/dotdir，写法理由见 backend job 里对该写法的详细注释。
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            WS="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE 未设置——拒绝在未知目录下清理}"
            if [ "$WS" = "/" ]; then
              echo "FATAL: GITHUB_WORKSPACE 解析为 / ——拒绝清理"
              exit 1
            fi
            # fail-closed：显式检查清理退出码——理由与写法见 backend job 同段注释
            # （含「为什么不用 `set -e`」）。清理没做完就继续 = 在未清空的工作区上跑 CI。
            if ! find "$WS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
              echo "FATAL: workspace 清理失败（$WS 未清空）——拒绝在残留目录上继续"
              exit 1
            fi
            if git init -q . &&
               (git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL") &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      # 本 job **刻意不加载 .env**：前端构建不需要任何凭据。
      # 实测依据（本批次）：frontend/ 全目录无 `process.env` / `import.meta.env` /
      # `VITE_*` 引用，vite.config.ts 的 proxy 目标与 base 全是字面量——所以
      # `npm ci && npm run build` 在零宿主 secret 下可完整复现。少一个 .env 就少一条
      # 凭据外泄路径（也是本 job 与 backend job 唯一有意义的差别）。
      - name: Pin Node (用 runner 预装的 nvm 版本，不下载)
        # 宿主用 nvm 管理 Node。runner 宿主进程的 PATH 由 `/home/yomu/actions-runner/.path`
        # 决定，其首项是 **v26.1.0**（`nvm alias default` = 26，Current 线）；而本仓
        # 前端工具链（Vite 8 / vue-tsc 3 / TS 6）与姊妹仓 elysia-frontend 的 `.nvmrc`
        # 都钉在 **22.23.0**（LTS 线）——宿主已预装（`/home/yomu/.nvm/versions/node/`）。
        # 所以这里只把它的 bin 前置到 PATH：**不引入 actions/setup-node、不下载**——
        # Node/npm 已正确预装，重复安装只会每次 run 多一次网络往返与一个可失败的环节
        # （build 实测（清空 node_modules 后）：22.23.0 = npm ci 2.6s + build 5.4s
        # ≈ 8s；26.1.0 = 2.1s + 5.3s ≈ 7.4s，两者都能过——选 22 是为了拿 LTS 线 +
        # 与前端仓同一个版本，让结果可复现）。
        shell: bash
        run: |
          NODE_BIN="/home/yomu/.nvm/versions/node/v22.23.0/bin"
          if [ ! -x "$NODE_BIN/node" ]; then
            echo "FATAL: 期望预装的 Node 不在 $NODE_BIN/node"
            echo "宿主 nvm 现有版本：$(ls -1 /home/yomu/.nvm/versions/node 2>/dev/null | tr '\n' ' ')"
            echo "修复：在宿主 nvm 装回 22.23.0，或同步更新本步骤与本注释里的版本号"
            exit 1
          fi
          echo "$NODE_BIN" >> "$GITHUB_PATH"
      - name: Verify Node/npm (fail fast)
        # runner 的 Node 由 nvm 管理，**会漂移**（`nvm alias default` 一改、或上面
        # 那个版本被 uninstall，实际生效的就是另一个运行时）。所以把**实际生效**的
        # 路径与版本显式打出来并断言主版本——漂移要红着停下，不能让构建结果悄悄
        # 换一个运行时还报绿。
        shell: bash
        run: |
          set -euo pipefail
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm) $(npm --version)"
          case "$(node --version)" in
            v22.*) ;;
            *) echo "FATAL: 期望 Node v22.x，实际 $(node --version)"; exit 1 ;;
          esac
      - name: Install frontend deps
        # 保持与迁移前**逐字等价**：仍是 `npm ci`（干净安装、严格按 package-lock.json）。
        # 不改成 `npm install`、不复用上一轮残留的 node_modules——那会让 CI 结果
        # 依赖 workspace 里恰好留着什么，不可复现。
        run: cd frontend && npm ci
      - name: Frontend type-check + build
        # `npm run build` = `vue-tsc --noEmit && vite build`（见 frontend/package.json）：
        # 类型检查与构建一条命令，语义与迁移前完全一致。不新增 gate、不跳过 typecheck。
        run: cd frontend && npm run build
      - name: Frontend unit tests
        # KB-56（Residual Correctness Closure）：`chatStore` 历史分页的会话归属不变量
        # （SI1–SI4）只能在 store 层被钉住——`npm run build` 只做类型检查，零行为覆盖。
        # vitest 是**唯一**新增的前端测试依赖（无 DOM/jsdom：store 是纯状态层）。
        run: cd frontend && npm test

