name: Full Suite (Manual)

on:
  workflow_dispatch:

jobs:
  full:
    name: Full Suite
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout (retry x4)
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          # self-hosted runner 到 github.com 网络抖动时重试；HTTP/1.1 由 runner 全局 git config 保证
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            rm -rf ./* ./.git 2>/dev/null || true
            if git init -q . &&
               git remote add origin "$REPO_URL" &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Load .env
        run: cp /home/yomu/elysia-agent/.env .env
      - name: Setup conda env (Elysia)
        # self-hosted runner 默认 shell 无 conda——把 Elysia env 的 bin 加入 PATH，
        # 使 ruff/pytest/python 可解析（等价 conda activate Elysia）
        run: echo "/home/yomu/miniconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Run full test suite
        run: |
          set -a
          source .env
          set +a
          make test-full
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
