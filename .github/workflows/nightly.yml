name: Full Suite (Nightly + Manual)

on:
  # 定时全量（P0）：`make test-full` 是唯一跑 integration/slow 的地方，此前只有
  # workflow_dispatch，因此从不自动执行。加 schedule 后每天自动跑一次。
  #   - cron 用非整点分钟（23）避开 GitHub Actions 整点排队高峰。
  #   - 安全性：schedule 触发的是仓库**受信 ref**（默认分支，非不受信 PR），
  #     因此本 job 用 `runs-on: self-hosted` + 宿主 .env 可接受——与 push 到 main
  #     的受信 job 同级信任边界（见 ci.yml 头注释 + scripts/check_ci_isolation.py）。
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  full:
    name: Full Suite
    # 只由受信触发（schedule / 管理员 workflow_dispatch）运行——显式 guard 让
    # scripts/check_ci_isolation.py 能静态识别为「非 PR 可达」受信 job。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout (retry x4)
        shell: bash
        env:
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          # self-hosted runner 到 github.com 网络抖动时重试；HTTP/1.1 由 runner 全局 git config 保证
          set -uo pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "== checkout attempt ${attempt}/4 =="
            rm -rf ./* ./.git 2>/dev/null || true
            if git init -q . &&
               git remote add origin "$REPO_URL" &&
               git -c protocol.version=2 fetch --quiet --depth 1 --no-tags origin "+${{ github.sha }}:refs/remotes/origin/target" &&
               git checkout --quiet --force refs/remotes/origin/target; then
              echo "checkout succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "checkout failed on attempt ${attempt}"
            if [ "$attempt" -ge 4 ]; then
              echo "FATAL: checkout failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Load .env
        # 仅受信 ref（schedule/手工触发）——不受信 PR 永不进入本 job
        run: cp /home/yomu/elysia-agent/.env .env
      - name: Setup conda env (Elysia)
        # self-hosted runner 默认 shell 无 conda——把 Elysia env 的 bin 加入 PATH，
        # 使 ruff/pytest/python 可解析（等价 conda activate Elysia）
        run: echo "/home/yomu/miniconda3/envs/Elysia/bin" >> $GITHUB_PATH
      - name: Run full test suite
        run: |
          set -a
          source .env
          set +a
          make test-full
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
