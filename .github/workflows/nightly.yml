name: Full Suite (Manual)

on:
  workflow_dispatch:

jobs:
  full:
    name: Full Suite
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run full test suite
        run: make test-full
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
