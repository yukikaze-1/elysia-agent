<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysia Agent</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background:#1a1a2e; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }
#header { background:#16213e; padding:12px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #0f3460; }
#header h1 { font-size:18px; color:#e94560; }
#state { font-size:12px; padding:4px 10px; border-radius:10px; background:#0f3460; }
#state.idle { background:#1a4a1a; color:#4caf50; }
#state.thinking { background:#4a3a1a; color:#ff9800; }
#state.speaking { background:#1a3a4a; color:#2196f3; }
#state.executing { background:#4a1a4a; color:#e040fb; }
#state.interrupted { background:#4a1a1a; color:#f44336; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; line-height:1.5; white-space:pre-wrap; }
.msg.user { align-self:flex-end; background:#0f3460; }
.msg.assistant { align-self:flex-start; background:#16213e; }
.msg .inner { font-style:italic; color:#aaa; margin-bottom:4px; }
#expression { font-size:13px; color:#e94560; text-align:center; min-height:20px; padding:4px; }
#input-area { padding:12px 20px; background:#16213e; border-top:1px solid #0f3460; display:flex; gap:8px; align-items:center; }
#input-area input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #0f3460; background:#1a1a2e; color:#e0e0e0; font-size:14px; outline:none; }
#input-area input:focus { border-color:#e94560; }
#input-area button { padding:8px 16px; border-radius:20px; border:none; cursor:pointer; font-size:14px; }
#send-btn { background:#e94560; color:white; }
#mic-btn { background:#0f3460; color:#e0e0e0; }
#mic-btn.active { background:#e94560; color:white; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
</style>
</head>
<body>
<div id="header">
  <h1>Elysia</h1>
  <span id="state" class="idle">idle</span>
</div>
<div id="chat"></div>
<div id="expression"></div>
<div id="input-area">
  <input id="text-input" type="text" placeholder="输入消息..." autofocus>
  <button id="mic-btn" title="麦克风">🎤</button>
  <button id="send-btn">发送</button>
</div>

<script>
const host = location.host;
const ws = new WebSocket(`ws://${host}/ws`);
let audioCtx = null, scriptNode = null, stream = null;
let currentDelta = null;

// ---- WebSocket handlers ----

ws.onopen = () => console.log('WS connected');
ws.onclose = () => console.log('WS disconnected');
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  switch (msg.type) {
    case 'delta':
      if (!currentDelta) {
        currentDelta = document.createElement('div');
        currentDelta.className = 'msg assistant';
        document.getElementById('chat').appendChild(currentDelta);
      }
      currentDelta.textContent += msg.content;
      scrollDown();
      break;
    case 'message':
      finalizeDelta();
      scrollDown();
      break;
    case 'expression':
      document.getElementById('expression').textContent = `${msg.expression} (${(msg.intensity*100)|0}%)`;
      break;
    case 'state':
      updateState(msg.state);
      break;
    case 'audio':
      bufferAudioChunk(msg.stream_id||0, msg.seq||0, msg.data, msg.is_final!==false);
      break;
    case 'audio_end':
      finalizeStream(msg.stream_id||0);
      break;
    case 'typing':
      if (msg.typing) startTyping(); else stopTyping();
      break;
    case 'error':
      console.warn('Server error:', msg.message);
      break;
  }
};

// ---- Chat helpers ----

function finalizeDelta() {
  currentDelta = null;
}

function scrollDown() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function updateState(state) {
  const el = document.getElementById('state');
  el.textContent = state;
  el.className = state;
}

let typingIndicator = null;
function startTyping() {
  if (!typingIndicator) {
    typingIndicator = document.createElement('div');
    typingIndicator.className = 'msg assistant';
    typingIndicator.textContent = '...';
    document.getElementById('chat').appendChild(typingIndicator);
    scrollDown();
  }
}
function stopTyping() {
  if (typingIndicator) {
    typingIndicator.remove();
    typingIndicator = null;
  }
}

// ---- Audio streaming playback ----

const audioQueue = [];     // { url, streamId }
let audioPlaying = false;

function bufferAudioChunk(streamId, seq, b64, isFinal) {
  if (!window._audioChunks) window._audioChunks = {};
  if (!window._audioChunks[streamId]) window._audioChunks[streamId] = [];
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  window._audioChunks[streamId].push(bytes);
}

function finalizeStream(streamId) {
  const chunks = window._audioChunks && window._audioChunks[streamId];
  if (!chunks || chunks.length === 0) return;
  delete window._audioChunks[streamId];

  let total = 0;
  for (const c of chunks) total += c.length;
  const buf = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }

  const blob = new Blob([buf], { type: 'audio/wav' });
  audioQueue.push({ url: URL.createObjectURL(blob), streamId });
  playNextInQueue();
}

function playNextInQueue() {
  if (audioPlaying || audioQueue.length === 0) return;
  audioPlaying = true;

  const item = audioQueue.shift();
  const audio = new Audio(item.url);
  audio.onended = () => {
    URL.revokeObjectURL(item.url);
    audioPlaying = false;
    playNextInQueue();
  };
  audio.play().catch(e => {
    console.warn('Audio play failed:', e, 'stream', item.streamId);
    URL.revokeObjectURL(item.url);
    audioPlaying = false;
    playNextInQueue();
  });
}

// ---- Text input ----

document.getElementById('send-btn').onclick = sendText;
document.getElementById('text-input').onkeydown = (e) => {
  if (e.key === 'Enter') sendText();
};

function sendText() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({type: 'text', content: text}));
  addUserMsg(text);
  input.value = '';
}

function addUserMsg(text) {
  finalizeDelta();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  document.getElementById('chat').appendChild(div);
  scrollDown();
}

// ---- Microphone ----

document.getElementById('mic-btn').onclick = toggleMic;

async function toggleMic() {
  if (stream) { stopMic(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

    scriptNode.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        int16[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
      }
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(int16.buffer);
      }
    };

    source.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);
    document.getElementById('mic-btn').classList.add('active');
    addStatusMsg('麦克风已开启');
  } catch (err) {
    console.error('Mic error:', err);
    document.getElementById('mic-btn').classList.remove('active');
    let hint = '无法访问麦克风。';
    if (err.name === 'NotAllowedError') hint = '请允许浏览器使用麦克风权限。';
    else if (err.name === 'NotFoundError') hint = '未检测到麦克风设备。';
    else if (err.name === 'NotReadableError') hint = '麦克风被其他应用占用。';
    addStatusMsg(hint);
  }
}

function stopMic() {
  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('mic-btn').classList.remove('active');
}

function addStatusMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.style.color = '#e94560';
  div.style.fontSize = '13px';
  div.textContent = '[系统] ' + text;
  document.getElementById('chat').appendChild(div);
  scrollDown();
  setTimeout(() => { div.style.opacity = '0.5'; }, 3000);
}
</script>
</body>
</html>
