<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysia</title>
<link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>

<!-- Left Panel -->
<div id="char-panel">
  <div id="avatar-wrap">
    <iframe id="live2d-frame" src="/static/live2d-demo/index.html" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
  <div id="char-info">
    <div id="state-dot"></div>
    <div id="char-name">Elysia</div>
  </div>
  <div id="char-state">idle</div>
  <div id="mood-tag"></div>
</div>

<!-- Center -->
<div id="main">
  <div id="chat-wrap"><div id="chat"></div></div>
  <div id="input-bar">
    <button id="mic-btn" title="麦克风">🎤</button>
    <textarea id="text-input" rows="1" placeholder="连接中..." autofocus></textarea>
    <button id="send-btn" disabled>➤</button>
  </div>
</div>

<!-- Settings -->
<button id="settings-btn" title="设置">⚙</button>
<div id="settings-panel">
  <div class="row"><span>TTS 语音</span><div class="toggle on" id="tts-toggle"></div></div>
  <label>音量</label>
  <div class="row"><input type="range" id="vol-slider" min="0" max="100" value="80"></div>
  <button id="clear-btn">清空对话</button>
  <button id="shutdown-btn">关闭服务</button>
  <div id="conn-status" class="disconnected">连接中...</div>
</div>

<script>
// ---- State ----
const host = location.host;
let ws, audioCtx, scriptNode, stream, audioPlaying = false;
const audioQueue = [];
const chatHistory = JSON.parse(localStorage.getItem('elysia_chat') || '[]');
let ttsEnabled = localStorage.getItem('elysia_tts') !== 'off';
let volume = parseInt(localStorage.getItem('elysia_vol') || '80');
let currentDelta = null, typingEl = null;
let lastMsgTime = 0, lastRole = '';
let userScrolledUp = false;
let nextBubbleQueue = [];  // 气泡已到达但音频还在播放 → 暂存，等音频结束再弹出
let _toolCards = {};       // tool name → card DOM element
let _playingBubble = null; // 当前正在播放 TTS 的气泡 DOM
let _streamBubbles = {};    // stream_id → .msg-bubble 元素映射，用于高亮

// ---- Init ----
document.getElementById('vol-slider').value = volume;
if (!ttsEnabled) document.getElementById('tts-toggle').classList.remove('on');
restoreChat();
connect();

// ---- WebSocket ----
function connect() {
  ws = new WebSocket(`ws://${host}/ws`);
  ws.onopen = () => {
    setConnStatus('connected', '已连接');
    document.getElementById('send-btn').disabled = false;
    document.getElementById('text-input').placeholder = '输入消息...';
  };
  ws.onclose = () => {
    setConnStatus('disconnected', '断开 — 3秒后重连');
    document.getElementById('send-btn').disabled = true;
    document.getElementById('text-input').placeholder = '连接断开，重连中...';
    setTimeout(connect, 3000);
  };
  ws.onmessage = handleWS;
}

function handleWS(e) {
  const msg = JSON.parse(e.data);
  switch (msg.type) {
    case 'delta':
      appendDelta(msg.content, msg.stream_id);
      break;
    case 'message':
      if (msg.content) {
        hideTyping();
        lastRole = 'assistant';
        const row = document.createElement('div'); row.className = 'msg-row assistant';
        row.innerHTML = '<div class="msg-avatar">🌸</div>';
        const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
        const textSpan = document.createElement('span'); textSpan.className = 'msg-text';
        textSpan.textContent = msg.content;
        bubble.appendChild(textSpan);
        const copyBtn = document.createElement('span'); copyBtn.className = 'copy-btn'; copyBtn.textContent = '复制';
        copyBtn.onclick = async (e) => { e.stopPropagation(); try { await navigator.clipboard.writeText(textSpan.textContent.trim()); copyBtn.textContent = '已复制'; copyBtn.classList.add('copied'); setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }, 2000); } catch {} };
        bubble.appendChild(copyBtn);
        row.appendChild(bubble);
        document.getElementById('chat').appendChild(row);
        if (msg.mood) {
          const moodEl = document.createElement('div'); moodEl.className = 'msg-mood';
          moodEl.textContent = `心情: ${msg.mood}`;
          document.getElementById('chat').appendChild(moodEl);
        }
        scrollDown();
      }
      finalizeDelta();
      break;
    case 'expression': setMood(msg.expression, msg.intensity); break;
    case 'state':
      setState(msg.state);
      if (msg.state === 'executing') { lastRole = null; }
      break;
    case 'audio': bufferAudioChunk(msg.stream_id||0, msg.seq||0, msg.data); break;
    case 'audio_end': finalizeStream(msg.stream_id||0); break;
    case 'typing':
      if (msg.typing) { showTyping(); }
      else { hideTyping(); }
      break;
    case 'transcription': {
      // Build display: text + emotion emoji + event emojis
      let display = msg.text;
      const emotionEmoji = getEmotionEmoji(msg.emotion);
      if (emotionEmoji) display += ' ' + emotionEmoji;
      if (msg.events && msg.events.length > 0) {
        for (const evt of msg.events) {
          const evtEmoji = getEventEmoji(evt);
          if (evtEmoji) display += ' ' + evtEmoji;
        }
      }
      addUserMsg('🎤 ' + display);
      break;
    }
    case 'action':
      if (msg.action === 'tool_executing') {
        addToolCard(msg.params.tool, msg.params.args);
      } else if (msg.action === 'tool_done') {
        updateToolCard(msg.params.tool, msg.params.success);
      }
      break;
    case 'error': console.warn('Server:', msg.message); break;
  }
}

// ---- Chat Display ----
function appendDelta(text, streamId) {
  if (!currentDelta) {
    const now = Date.now();
    if (now - lastMsgTime > 300000 && lastMsgTime > 0) {
      const div = document.createElement('div'); div.className = 'time-divider';
      div.textContent = new Date(now).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      document.getElementById('chat').appendChild(div);
    }
    lastMsgTime = now;
    if (lastRole === 'assistant') {
      const rows = document.querySelectorAll('.msg-row.assistant');
      const last = rows[rows.length - 1];
      if (last) {
        const textSpan = last.querySelector('.msg-text');
        if (textSpan) {
          currentDelta = textSpan;
          currentDelta.textContent += text;
          return;
        }
      }
    }
    lastRole = 'assistant';
    const row = document.createElement('div'); row.className = 'msg-row assistant';
    row.innerHTML = '<div class="msg-avatar">🌸</div>';
    const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    const textSpan = document.createElement('span'); textSpan.className = 'msg-text';
    bubble.appendChild(textSpan);
    const copyBtn = document.createElement('span'); copyBtn.className = 'copy-btn'; copyBtn.textContent = '复制';
    copyBtn.onclick = async (e) => { e.stopPropagation(); try { await navigator.clipboard.writeText(textSpan.textContent.trim()); copyBtn.textContent = '已复制'; copyBtn.classList.add('copied'); setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }, 2000); } catch {} };
    bubble.appendChild(copyBtn);
    row.appendChild(bubble);
    // stream_id → bubble 映射，用于 TTS 播放时高亮
    if (streamId != null) _streamBubbles[streamId] = bubble;
    // 音频在播：不挂 DOM，等弹出时再 append（避免占位空白）
    if (audioPlaying) {
      row.style.animation = 'none';
      row.style.opacity = '0';
      row.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      row.style.transform = 'translateY(8px)';
      nextBubbleQueue.push(row);
    } else {
      document.getElementById('chat').appendChild(row);
    }
    currentDelta = textSpan;
  }
  currentDelta.textContent += text;
  scrollDown();
  debounceSave();
}

let _saveTimer = null;
function debounceSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveChat, 500);
}

function finalizeDelta() {
  if (currentDelta) { currentDelta = null; saveChat(); }
  lastRole = null;  // 下一句 delta 创建新气泡，不复用上一个
}

function revealNextQueuedBubble() {
  if (!nextBubbleQueue.length) return;
  const row = nextBubbleQueue.shift();
  document.getElementById('chat').appendChild(row);
  // 触发 CSS transition 淡入
  requestAnimationFrame(() => {
    row.style.opacity = '1';
    row.style.transform = 'translateY(0)';
  });
  // 当前 TTS 正在播放 → 高亮对应气泡
  const bubble = row.querySelector('.msg-bubble');
  if (bubble && (audioPlaying || audioQueue.length > 0)) {
    highlightPlaying(bubble);
  }
  scrollDown();
  debounceSave();
}

function highlightPlaying(bubble) {
  if (_playingBubble) {
    _playingBubble.classList.remove('playing', 'pulse');
  }
  _playingBubble = bubble;
  bubble.classList.add('playing');
  bubble.classList.add('pulse');
}

function clearPlayingHighlight() {
  if (_playingBubble) {
    _playingBubble.classList.remove('playing', 'pulse');
    _playingBubble = null;
  }
}

function addUserMsg(text) {
  finalizeDelta();
  nextBubbleQueue = [];  // 新消息清除排队气泡
  _streamBubbles = {};   // 清除 stream 映射
  clearPlayingHighlight();
  lastRole = 'user';
  const row = document.createElement('div'); row.className = 'msg-row user';
  row.innerHTML = `<div class="msg-bubble">${esc(text)}</div><div class="msg-avatar">😎</div>`;
  document.getElementById('chat').appendChild(row);
  scrollDown();
  saveChat();
}

function addStatusMsg(text) {
  finalizeDelta();
  const row = document.createElement('div'); row.className = 'msg-row assistant';
  row.innerHTML = `<div class="msg-avatar"></div><div class="msg-status">${esc(text)}</div>`;
  document.getElementById('chat').appendChild(row);
  scrollDown();
}

// ---- Tool Cards ----
function addToolCard(name, args) {
  finalizeDelta();
  const argsStr = args ? Object.entries(args).map(([k,v]) => `${k}: ${v}`).join(', ') : '';
  const card = document.createElement('div');
  card.className = 'tool-card executing';
  card.id = `tool-${name}`;
  card.innerHTML = `
    <div class="tool-card-header" onclick="this.parentElement.classList.toggle('expanded')">
      <span class="tool-icon">🔧</span>
      <span class="tool-name">${esc(name)}</span>
      <span class="tool-status"><span class="tool-spinner"></span> 执行中</span>
      <span class="tool-card-chevron">▾</span>
    </div>
    <div class="tool-card-body">
      <div class="tool-card-args">${esc(argsStr)}</div>
    </div>`;
  document.getElementById('chat').appendChild(card);
  _toolCards[name] = card;
  scrollDown();
}

function updateToolCard(name, success) {
  const card = _toolCards[name];
  if (!card) return;
  card.classList.remove('executing');
  card.classList.add(success ? 'done' : 'fail');
  const status = card.querySelector('.tool-status');
  const icon = card.querySelector('.tool-icon');
  if (success) {
    status.innerHTML = '<span style="color:var(--idle)">✓</span> 完成';
    icon.textContent = '🔧';
  } else {
    status.innerHTML = '<span style="color:var(--accent)">✗</span> 失败';
    icon.textContent = '⚠️';
  }
}

function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement('div'); typingEl.className = 'msg-row assistant';
  typingEl.innerHTML = '<div class="msg-avatar">🌸</div><div class="msg-bubble typing-dots"><span></span><span></span><span></span></div>';
  document.getElementById('chat').appendChild(typingEl);
  scrollDown();
}

function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function setMood(mood, intensity) {
  const tag = document.getElementById('mood-tag');
  tag.textContent = mood ? `${moodEmoji(mood)} ${mood} ${Math.round(intensity*100)}%` : '';
  tag.style.color = moodColor(mood);
}

function setState(state) {
  document.getElementById('char-state').textContent = state;
  document.getElementById('state-dot').className = state;
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// STT emotion/event emoji mappings (synced with server-side)
const EMOTION_EMOJI = {
  HAPPY:'😊', SAD:'😔', ANGRY:'😡', NEUTRAL:'',
  FEARFUL:'😰', DISGUSTED:'🤢', SURPRISED:'😮',
};
const EVENT_EMOJI = {
  BGM:'🎼', Applause:'👏', Laughter:'😀', Cry:'😭',
  Cough:'😷', Sneeze:'🤧',
};
function getEmotionEmoji(tag) { return EMOTION_EMOJI[tag] || ''; }
function getEventEmoji(evt) { return EVENT_EMOJI[evt] || ''; }
function moodEmoji(m) { return {happy:'😊',sad:'😢',excited:'🤩',curious:'🤔',neutral:'😐'}[m]||''; }
function moodColor(m) { return {happy:'var(--happy)',sad:'var(--sad)',excited:'var(--excited)',neutral:'var(--muted)'}[m]||'var(--muted)'; }

// ---- Scroll ----
function scrollDown() {
  if (userScrolledUp) { showNewMsgIndicator(); return; }
  const wrap = document.getElementById('chat-wrap');
  requestAnimationFrame(() => { wrap.scrollTop = wrap.scrollHeight; });
}
document.getElementById('chat-wrap').addEventListener('scroll', function() {
  const w = this;
  const wasUp = userScrolledUp;
  userScrolledUp = w.scrollTop + w.clientHeight < w.scrollHeight - 60;
  if (!userScrolledUp && wasUp) hideNewMsgIndicator();
});

// ---- New Message Indicator ----
function showNewMsgIndicator() {
  let el = document.getElementById('new-msg-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'new-msg-indicator';
    el.textContent = '↓ 新消息';
    el.onclick = () => {
      userScrolledUp = false;
      scrollDown();
    };
    document.getElementById('chat-wrap').appendChild(el);
  }
  el.classList.add('visible');
}
function hideNewMsgIndicator() {
  const el = document.getElementById('new-msg-indicator');
  if (el) el.classList.remove('visible');
}

// ---- Persistence ----
function saveChat() {
  const msgs = [];
  document.querySelectorAll('.msg-row').forEach(r => {
    if (r.querySelector('.msg-status')) return;
    const role = r.classList.contains('user') ? 'user' : 'assistant';
    const textSpan = r.querySelector('.msg-text');
    const content = textSpan ? textSpan.textContent : (r.querySelector('.msg-bubble')?.textContent || '');
    if (content) msgs.push({ role, content });
  });
  localStorage.setItem('elysia_chat', JSON.stringify(msgs.slice(-100)));
}

function restoreChat() {
  chatHistory.forEach(m => {
    if (m.role === 'user') addUserMsg(m.content);
    else {
      lastRole = 'assistant';
      const row = document.createElement('div'); row.className = 'msg-row assistant';
      row.innerHTML = `<div class="msg-avatar">🌸</div><div class="msg-bubble">${esc(m.content)}</div>`;
      document.getElementById('chat').appendChild(row);
    }
  });
  scrollDown();
}

// ---- Input ----
const textInput = document.getElementById('text-input');
document.getElementById('send-btn').onclick = sendText;
textInput.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  // Auto-resize
  setTimeout(() => { textInput.style.height = 'auto'; textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px'; }, 0);
};

function sendText() {
  const text = textInput.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type:'text',content:text}));
  addUserMsg(text);
  textInput.value = ''; textInput.style.height = '42px';
  const btn = document.getElementById('send-btn');
  btn.classList.add('sent');
  btn.disabled = true;
  setTimeout(() => { btn.classList.remove('sent'); btn.disabled = false; }, 800);
}

// ---- Mic ----
document.getElementById('mic-btn').onclick = toggleMic;

async function toggleMic() {
  if (stream) { stopMic(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:true}});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate: 16000});
    const source = audioCtx.createMediaStreamSource(stream);
    scriptNode = audioCtx.createScriptProcessor(4096,1,1);
    scriptNode.onaudioprocess = e => {
      const input = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(input.length);
      for (let i=0;i<input.length;i++) int16[i]=Math.max(-32768,Math.min(32767,input[i]*32768));
      if (ws.readyState===WebSocket.OPEN) ws.send(int16.buffer);
    };
    source.connect(scriptNode); scriptNode.connect(audioCtx.destination);
    document.getElementById('mic-btn').classList.add('active');
    addStatusMsg('麦克风已开启');
  } catch(err) {
    let hint='无法访问麦克风。';
    if (err.name==='NotAllowedError') hint='请允许浏览器使用麦克风权限。';
    else if (err.name==='NotFoundError') hint='未检测到麦克风设备。';
    addStatusMsg(hint); stopMic();
  }
}

function stopMic() {
  if (scriptNode) { scriptNode.disconnect(); scriptNode=null; }
  if (audioCtx) { audioCtx.close(); audioCtx=null; }
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('mic-btn').classList.remove('active');
}

// ---- Audio ----
function bufferAudioChunk(streamId, seq, b64) {
  if (!window._ac) window._ac = {};
  if (!window._ac[streamId]) window._ac[streamId] = [];
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  window._ac[streamId].push(bytes);
}

function finalizeStream(streamId) {
  if (!ttsEnabled) return;
  const chunks = window._ac && window._ac[streamId];
  if (!chunks||chunks.length===0) return;
  delete window._ac[streamId];
  let total=0; for(const c of chunks) total+=c.length;
  const buf = new Uint8Array(total); let off=0;
  for(const c of chunks){buf.set(c,off);off+=c.length;}
  audioQueue.push({url:URL.createObjectURL(new Blob([buf],{type:'audio/wav'})),streamId});
  playNext();
}

function playNext() {
  if (audioPlaying||audioQueue.length===0) return;
  audioPlaying=true;
  const item=audioQueue.shift();
  const a=new Audio(item.url); a.volume=volume/100;
  a.onended=()=>{
    URL.revokeObjectURL(item.url);
    // 清除已播 stream 的 bubble 映射
    if (item.streamId != null) delete _streamBubbles[item.streamId];
    audioPlaying=false;
    // 上一句播放完，弹出排队中的下一个气泡
    if (!audioQueue.length) revealNextQueuedBubble();
    // 队列空了 → 取消高亮
    if (!audioQueue.length) clearPlayingHighlight();
    playNext();
  };
  a.play().then(()=>{})
    .catch(e=>{URL.revokeObjectURL(item.url);audioPlaying=false;playNext();});
  // 开始播放新音频时立即弹出对应的排队气泡
  revealNextQueuedBubble();
  // 高亮当前 stream 对应的气泡（含首句已在 DOM 中的情况）
  if (item.streamId != null) {
    const bubble = _streamBubbles[item.streamId];
    if (bubble) highlightPlaying(bubble);
  }
}

// ---- Settings ----
document.getElementById('settings-btn').onclick = () => {
  document.getElementById('settings-panel').classList.toggle('open');
};
document.getElementById('tts-toggle').onclick = function() {
  this.classList.toggle('on'); ttsEnabled = this.classList.contains('on');
  localStorage.setItem('elysia_tts', ttsEnabled ? 'on' : 'off');
  if (!ttsEnabled) { window._ac = {}; audioQueue.length = 0; }
};
document.getElementById('vol-slider').oninput = function() {
  volume = parseInt(this.value);
  localStorage.setItem('elysia_vol', volume);
};
document.getElementById('shutdown-btn').onclick = async () => {
  if (!confirm('确定要关闭 Elysia 服务吗？')) return;
  try {
    const res = await fetch('/shutdown', {method:'POST'});
    if (res.ok) {
      addStatusMsg('服务已关闭');
      setTimeout(() => { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:18px;">Elysia 已关闭 🫧</div>'; }, 500);
    } else {
      addStatusMsg('关闭失败');
    }
  } catch(e) {
    // Server may close before sending response — check if connection lost
    addStatusMsg('服务已关闭');
    setTimeout(() => { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:18px;">Elysia 已关闭 🫧</div>'; }, 500);
  }
};
document.getElementById('clear-btn').onclick = () => {
  document.getElementById('chat').innerHTML = '';
  _toolCards = {};
  localStorage.removeItem('elysia_chat');
};

function setConnStatus(cls, text) {
  const el = document.getElementById('conn-status');
  el.className = cls; el.textContent = text;
}
</script>
</body>
</html>
