<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysia</title>
<link rel="stylesheet" href="/static/css/chat.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- Left Panel -->
<div id="char-panel">
  <div id="avatar-wrap">
    <iframe id="live2d-frame" src="/static/live2d-demo/index.html" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
  <div id="char-info">
    <div id="state-dot"></div>
    <div id="char-name">Elysia</div>
  </div>
  <div id="char-state">idle</div>
  <div id="mood-tag"></div>
</div>

<!-- Center -->
<div id="main">
  <div id="chat-wrap"><div id="chat"></div></div>
  <div id="input-bar">
    <button id="mic-btn" title="麦克风">🎤</button>
    <textarea id="text-input" rows="1" placeholder="连接中..." autofocus></textarea>
    <button id="send-btn" disabled>➤</button>
  </div>
</div>

<!-- Settings -->
<button id="settings-btn" title="设置">⚙</button>
<button id="tools-btn" title="工具">🔧</button>
<div id="settings-panel">
  <div class="row"><span>TTS 语音</span><div class="toggle on" id="tts-toggle"></div></div>
  <div class="row"><span>唤醒词</span><div class="toggle" id="wake-toggle"></div></div>
  <label>音量</label>
  <div class="row"><input type="range" id="vol-slider" min="0" max="100" value="80"></div>
  <button id="clear-btn">清空对话</button>
  <button id="restart-btn">重启服务</button>
  <button id="shutdown-btn">关闭服务</button>
  <div id="conn-status" class="disconnected">连接中...</div>
</div>

<!-- Tools Panel -->
<div id="tools-panel">
  <div class="tools-title">工具插件管理</div>
  <div id="tools-list"></div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
