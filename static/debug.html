<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysia Debug</title>
<style>
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --border: #2a2a4a;
  --text: #ddd; --muted: #888; --accent: #e94560; --green: #4caf50;
  --warn: #ff9800; --red: #f44336;
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, monospace; background: var(--bg);
  color: var(--text); padding: 20px; max-width: 1100px; margin: 0 auto;
  font-size: 13px; line-height: 1.5;
}
h1 { font-size: 18px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
}
.card h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 8px; border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.card-wide { grid-column: 1 / -1; }
.row { display: flex; justify-content: space-between; padding: 2px 0; }
.label { color: var(--muted); }
.value { font-weight: 500; max-width: 70%; text-align: right; word-break: break-all; }
.ok { color: var(--green); }
.fail { color: var(--red); }
.warn { color: var(--warn); }
.list-item {
  padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 12px;
}
.list-item:last-child { border-bottom: none; }
.role-tag {
  display: inline-block; padding: 1px 5px; border-radius: 3px;
  font-size: 10px; font-weight: 600; margin-right: 4px;
}
.role-tag.user { background: #1a3a5c; color: #6af; }
.role-tag.assistant { background: #2a1a3a; color: #f6a; }
.type-tag {
  display: inline-block; padding: 1px 5px; border-radius: 3px;
  font-size: 10px; font-weight: 600; margin-right: 4px;
  background: #1a2a1a; color: var(--green);
}
.tool-name { color: var(--warn); font-weight: 600; }
.tool-args { color: var(--muted); font-size: 11px; }
.tool-result { color: var(--text); }
.tool-error { color: var(--red); }
.tool-desc { color: var(--muted); font-size: 12px; display: block; margin: 2px 0 4px; }
.param-tag { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; margin-right: 3px; color: var(--text); }
.param-tag i { color: var(--muted); margin-left: 3px; font-style: italic; }
.req-tag { background: #1a3a5c; color: #6ba3d6; border-radius: 3px; padding: 1px 6px; font-size: 10px; margin-right: 3px; }
.tool-card { padding: 6px 0; border-bottom: 1px solid var(--border); }
.tool-card:last-child { border-bottom: none; }
.empty { color: var(--muted); font-style: italic; padding: 4px 0; }
.prompt-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
.prompt-item:last-child { border-bottom: none; }
#error-banner {
  display: none; background: var(--red); color: white; padding: 8px 14px;
  border-radius: var(--radius); margin-bottom: 12px; font-size: 12px;
}
#updated { font-size: 11px; color: var(--muted); }
.header { display: flex; justify-content: space-between; align-items: flex-start; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.truncated { color: var(--text); }
.truncated:hover { color: #fff; }
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  .card-wide { grid-column: auto; }
  body { padding: 10px; font-size: 12px; }
  .header { flex-direction: column; gap: 8px; }
}
/* Tab 导航 */
.tabs { display: flex; gap: 2px; margin-bottom: 16px; }
.tab-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 16px; border-radius: var(--radius) var(--radius) 0 0;
  cursor: pointer; font-size: 13px; transition: color 0.15s;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--surface); font-weight: 600; }
.tab-btn:hover { color: var(--text); }
.tab-content { display: none; }
.tab-content.active { display: block; }
/* 数据库面板 */
.db-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.db-panel-full { grid-template-columns: 1fr; }
@media (max-width: 1200px) { .db-panel { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) { .db-panel { grid-template-columns: 1fr; } }
.db-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 4px 10px; border-radius: 4px;
  cursor: pointer; font-size: 12px; margin-right: 4px;
}
.db-btn:hover { border-color: var(--accent); }
.db-btn.danger { color: var(--red); }
.db-btn.danger:hover { background: var(--red); color: #fff; border-color: var(--red); }
.db-stat { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.db-stat b { color: var(--text); }
.db-search { display: flex; gap: 6px; margin-bottom: 10px; }
.db-search input, .db-search select {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;
}
.db-search input { flex: 1; }
.db-search select { min-width: 80px; }
.db-item {
  padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 12px; display: flex; align-items: flex-start; gap: 6px;
}
.db-item:last-child { border-bottom: none; }
.db-item .text { flex: 1; word-break: break-all; }
.db-item .meta { flex-shrink: 0; display: flex; gap: 4px; align-items: center; }
.db-item .delete-btn {
  color: var(--red); cursor: pointer; font-size: 14px; line-height: 1;
  padding: 0 4px; opacity: 0.5; transition: opacity 0.15s;
}
.db-item .delete-btn:hover { opacity: 1; }
/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 100; justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; max-width: 400px; width: 90%;
}
.modal-box h3 { margin-bottom: 10px; }
.modal-box p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.modal-box .actions { display: flex; gap: 8px; justify-content: flex-end; }
/* Session detail */
.session-detail { margin-top: 8px; padding: 8px; background: var(--bg); border-radius: 4px; }
.session-detail .msg { padding: 2px 0; font-size: 12px; }
/* 图片缩略图 */
.msg-images { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.msg-image {
  max-width: 120px; max-height: 120px; border-radius: 6px;
  cursor: pointer; display: block; border: 1px solid var(--border);
  object-fit: cover; transition: transform 0.15s;
}
.msg-image:hover { transform: scale(1.05); }
/* Debug lightbox */
#debug-lightbox {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
}
#debug-lightbox.show { display: flex; }
#debug-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
/* ── 任务 Tab ── */
.task-card {
  background: var(--surface);
  border-radius: 8px;
  padding: 0.8em 1em;
  margin-bottom: 0.6em;
  border-left: 3px solid var(--accent);
}
.task-card.status-running  { border-left-color: #4fc3f7; }
.task-card.status-completed { border-left-color: #66bb6a; opacity: 0.8; }
.task-card.status-failed   { border-left-color: #ef5350; }
.task-card.status-cancelled { border-left-color: #888; opacity: 0.6; }

.task-card .task-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0.4em;
}
.task-card .task-id { font-family: monospace; font-size: 0.85em; color: var(--muted); }
.task-card .task-status { font-weight: bold; font-size: 0.85em; }
.task-card .task-status.status-running { color: #4fc3f7; }
.task-card .task-status.status-completed { color: #66bb6a; }
.task-card .task-status.status-failed { color: #ef5350; }

.task-card .task-intent { font-size: 0.9em; margin-bottom: 0.3em; }
.task-card .task-meta { font-size: 0.8em; color: var(--muted); margin-bottom: 0.4em; }

.task-card .task-dag {
  background: var(--bg); padding: 0; border-radius: 4px;
  margin-top: 0.3em; overflow: hidden;
}

.task-progress-bar {
  height: 4px; background: var(--bg); border-radius: 2px; margin: 0.4em 0;
}
.task-progress-bar .fill { height: 100%; border-radius: 2px; background: var(--accent); }

.task-done-row {
  font-size: 0.85em; padding: 0.3em 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>
<body>

<div id="error-banner"></div>

<div class="header">
  <div>
    <h1>Elysia Debug</h1>
    <div class="sub">内部状态监控 — <span id="updated">等待数据...</span></div>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="pause-btn" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">暂停</button>
    <button id="copy-btn" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">复制 JSON</button>
    <button id="copy-btn-light" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">精简 JSON</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="overview">概览</button>
  <button class="tab-btn" data-tab="database">数据库</button>
  <button class="tab-btn" data-tab="tasks">任务</button>
</div>

<div class="tab-content active" id="tab-overview">
  <div class="grid" id="grid"></div>
</div>

<div class="tab-content" id="tab-database">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div class="sub" id="db-updated">点击「刷新」加载数据</div>
    <button class="db-btn" id="db-refresh-btn" style="font-weight:600;">刷新</button>
  </div>
  <div class="db-panel" id="db-panels"></div>

  <!-- 新增条目 Modal -->
  <div class="modal-overlay" id="add-entry-modal">
    <div class="modal-box">
      <h3>新增 Long-Term Memory 条目</h3>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input id="add-text" placeholder="记忆内容" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
        <div style="display:flex;gap:8px;">
          <select id="add-type" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;">
            <option value="fact">fact</option><option value="plan">plan</option>
            <option value="preference">preference</option><option value="note">note</option>
          </select>
          <input id="add-poignancy" type="number" min="1" max="10" value="5" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;width:60px;">
        </div>
      </div>
      <div class="actions" style="margin-top:12px;">
        <button class="db-btn" onclick="closeAddModal()">取消</button>
        <button class="db-btn" id="add-submit-btn" style="background:var(--accent);color:#fff;">新增</button>
      </div>
    </div>
  </div>

  <!-- 确认 Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h3 id="confirm-title">确认操作</h3>
      <p id="confirm-msg"></p>
      <div class="actions">
        <button class="db-btn" onclick="closeConfirmModal()">取消</button>
        <button class="db-btn danger" id="confirm-yes-btn">确认</button>
      </div>
    </div>
  </div>

</div>

<section id="tab-tasks" style="display:none;">
  <div id="tasks-overview" class="card" style="margin-bottom:1em; padding:0.5em 1em; font-size:0.9em; color:var(--muted);">
    <span id="tasks-stats">运行中: 0 | SSE: ⏳连接中</span>
  </div>
  <div id="tasks-active"></div>
  <details id="tasks-done-section" style="margin-top:1em;">
    <summary>已完成/失败的任务</summary>
    <div id="tasks-done-list"></div>
  </details>
</section>

<!-- LLM Prompt 详情面板 (必须在 tab 容器外部，否则 display:none 的 tab 会阻止渲染) -->
<div id="prompt-overlay" class="modal-overlay" onclick="if(event.target===this)closePrompt()">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:95vw;width:1200px;max-height:85vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;">
      <h3 style="margin:0;color:var(--accent);" id="prompt-title">📝 Prompt #-</h3>
      <div>
        <button onclick="copyPromptJSON()" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;font-size:12px;margin-right:6px;">📋 复制 JSON</button>
        <button onclick="navigatePrompt(-1)" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 8px;font-size:12px;">◀</button>
        <button onclick="navigatePrompt(1)" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 8px;font-size:12px;margin-right:6px;">▶</button>
        <button onclick="closePrompt()" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;font-size:12px;">关闭</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" id="prompt-content"></div>
    <div id="prompt-tools" style="margin-top:12px;"></div>
    <pre id="prompt-tools-json" style="display:none;"></pre>
    <pre id="prompt-tools-text" style="display:none;"></pre>
  </div>
</div>

<!-- LLM Raw Response 详情面板 -->
<div id="response-overlay" class="modal-overlay" onclick="if(event.target===this)closeResponse()">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:95vw;width:1000px;max-height:85vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;">
      <h3 style="margin:0;color:var(--accent);" id="response-title">📤 Raw Response #-</h3>
      <div>
        <button onclick="navigateResponse(-1)" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 8px;font-size:12px;">◀</button>
        <button onclick="navigateResponse(1)" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 8px;font-size:12px;margin-right:6px;">▶</button>
        <button onclick="closeResponse()" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;font-size:12px;">关闭</button>
      </div>
    </div>
    <div id="response-inner-voice" style="color:#888;font-style:italic;font-size:13px;padding:8px 12px;border-left:2px solid #888;margin-bottom:12px;display:none;"></div>
    <pre id="response-raw" style="background:var(--bg);color:var(--text);padding:12px;border-radius:4px;font-size:12px;white-space:pre-wrap;word-break:break-word;margin:0;"></pre>
  </div>
</div>

<script src="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.js"></script>
<script>
const POLL_MS = 2000;
const POLL_MAX_MS = 30000;
let timer = null;
let pollInterval = POLL_MS;
let paused = false;
let lastInfo = null;

// esc() 定义与 js/esc.js 保持一致，debug.html 为非模块页无法 import
function esc(s) { const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function ok(v) { return v ? '<span class="ok">&#10003;</span>' : '<span class="fail">&#10007;</span>'; }
function trunc(s, n) { return s && s.length > n ? s.slice(0,n)+'…' : s||''; }

function renderImages(content) {
  if (!content || !Array.isArray(content)) return '';
  const images = content.filter(p => p && p.type === 'image' && p.source);
  if (!images.length) return '';
  return '<div class="msg-images">' + images.map(img =>
    `<img class="msg-image" src="${esc(img.source)}" loading="lazy"
          onclick="event.stopPropagation(); openDebugLightbox('${esc(img.source)}')"
          title="点击放大">`
  ).join('') + '</div>';
}

function openDebugLightbox(url) {
  document.getElementById('debug-lightbox-img').src = url;
  document.getElementById('debug-lightbox').classList.add('show');
}

function closeDebugLightbox() {
  document.getElementById('debug-lightbox').classList.remove('show');
  document.getElementById('debug-lightbox-img').src = '';
}

function expandable(text, maxLen) {
  if (!text || text.length <= maxLen) return esc(text);
  const id = 'ex-' + Math.random().toString(36).slice(2, 10);
  return `<span id="${id}" class="truncated" onclick="
    var el=document.getElementById('${id}');
    if(el.classList.contains('truncated')){
      el.textContent=el.getAttribute('data-full');
      el.classList.remove('truncated');
    }else{
      el.textContent=el.getAttribute('data-short');
      el.classList.add('truncated');
    }
  " style="cursor:pointer;" title="点击展开/收起"
    data-full="${esc(text).replace(/"/g, '&quot;')}"
    data-short="${esc(text.slice(0, maxLen)).replace(/"/g, '&quot;')}…"
  >${esc(text.slice(0, maxLen))}…</span>`;
}

function render(info) {
  document.getElementById('updated').textContent = new Date().toLocaleTimeString();
  document.getElementById('error-banner').style.display = 'none';

  // 关键字段未变化则跳过 DOM 重建
  if (lastInfo) {
    const same = (
      lastInfo.fsm_state === info.fsm_state &&
      lastInfo.processing === info.processing &&
      lastInfo.session_messages === info.session_messages &&
      lastInfo.lt_count === info.lt_count &&
      lastInfo.ws_clients === info.ws_clients &&
      JSON.stringify(lastInfo.currently_executing) === JSON.stringify(info.currently_executing) &&
      JSON.stringify(lastInfo.timing_stats) === JSON.stringify(info.timing_stats) &&
      JSON.stringify(lastInfo.prompt_summary) === JSON.stringify(info.prompt_summary) &&
      JSON.stringify(lastInfo.response_summary) === JSON.stringify(info.response_summary) &&
      JSON.stringify(lastInfo.self_l2) === JSON.stringify(info.self_l2) &&
      JSON.stringify(lastInfo.state_l3) === JSON.stringify(info.state_l3) &&
      lastInfo.last_awareness_time === info.last_awareness_time &&
      JSON.stringify(lastInfo.state_history) === JSON.stringify(info.state_history)
    );
    if (same) return;
  }
  lastInfo = info;

  const cards = [
    // Row 1: System | Memory
    [
      { title:'System', wide:false, rows:[
        ['FSM State', `<span class="${info.fsm_state==='idle'?'ok':'warn'}">${esc(info.fsm_state)}</span>`],
        ['Previous', esc(info.fsm_previous||'—')],
        ['Processing', info.processing ? '<span class="warn">yes</span>' : '<span class="ok">no</span>'],
        ['Uptime', (() => { const s = info.uptime_seconds || 0; return s >= 3600 ? (s/3600).toFixed(1)+'h' : s >= 60 ? Math.floor(s/60)+'min' : Math.floor(s)+'s'; })()],
        ['LLM Model', esc(info.llm_model) + (/mock/i.test(info.llm_model || '') ? ' <span class="warn">MOCK</span>' : '')],
        ['TTS', ok(info.tts_ok)],
        ['STT', ok(info.stt_ok)],
        ['WS Clients', info.ws_clients],
        ['Proactive', info.proactive_enabled ? '<span class="ok">ON</span>' : '<span class="warn">OFF</span>'],
      ]},
      { title:'Memory', wide:false, rows:[
        ['Session Messages', info.session_messages],
        ['Long-term Entries', info.lt_count],
        ['MongoDB', ok(info.mongodb_ok)],
        ['Milvus', ok(info.milvus_ok)],
        ['Embedding', ok(info.embedding_ok)],
        ['Session Params', esc(trunc(JSON.stringify(info.session_params || {}), 80))],
        ['Archive Msgs', (info.archive_msg_count || 0).toLocaleString()],
        ['Character', info.character_name],
        ['L1 Core', info.base_personality_summary ? esc(trunc(info.base_personality_summary, 100)) : 'N/A'],
      ]},
    ],
    // Row 2: Latency | Process Memory | Scheduler
    [
      { title:'Latency', wide:false, rows: (() => {
        const s = info.timing_stats;
        if (!s || !s.count) return [['—', '暂无数据']];
        return [
          ['轮次', `${s.count} (avg ${s.avg_ms}ms)`],
          ['P50', `${s.p50_ms}ms`],
          ['P95', `${s.p95_ms}ms`],
          ['P99', `${s.p99_ms}ms`],
          ['最近', `${s.last_ms}ms`],
        ];
      })()},
      { title:'Process Memory', wide:false, rows: (() => {
        const m = info.memory;
        if (!m || m.error) return [['—', m?.error || 'N/A']];
        return [
          ['RSS', `${m.rss_mb} MB`],
          ['VMS', `${m.vms_mb} MB`],
          ['占比', `${m.pct}%`],
          ['线程', m.num_threads],
        ];
      })()},
      { title:'Scheduler', wide:false, rows: [
        ['Pending', info.scheduler_pending ?? '—'],
        ['Running', info.scheduler_running ?? '—'],
        ['Total', info.scheduler_total ?? '—'],
        ['Task Tree', info.task_tree && Object.keys(info.task_tree).length
          ? esc(JSON.stringify(info.task_tree).slice(0, 120)+'…')
          : '暂无'],
      ]},
      { title:'Token 消耗', wide:false, rows: (() => {
        const ts = info.token_stats || {};
        if (!ts.session_total && !info.pending_token_count && !info.pending_session_exists) return [['总计', '暂无数据']];
        const models = ts.per_model || {};
        const rows = [];
        if (ts.session_total) {
          rows.push(['总计', `<b>${ts.session_total.toLocaleString()}</b> tokens`]);
        }
        if (Object.keys(models).length) {
          rows.push(['按模型', Object.entries(models)
            .map(([m, t]) => `${m.split('/').pop()}: ${t.toLocaleString()}`)
            .join('<br>')]);
        }
        if (info.pending_token_count > 0) {
          rows.push(['⚠ Pending', `${info.pending_token_count} 条待导入`]);
        }
        if (info.pending_session_exists) {
          rows.push(['⚠ Session', '未导入快照']);
        }
        return rows;
      })()},
      { title:'📝 LLM Prompt', wide:false, items: (() => {
        const ps = info.prompt_summary || {};
        const records = ps.records || [];
        if (!records.length) return [];
        const recent = records.slice(-3);
        return recent.map(r => {
          const time = r.timestamp ? r.timestamp.split('T')[1].split('.')[0] : '--:--:--';
          const round = r.round_num !== undefined ? `R${r.round_num + 1}` : '';
          const chars = r.total_chars ? `${r.total_chars.toLocaleString()}字` : '';
          const shortModel = (r.model || '').split('/').pop();
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0;">
            <span><span class="role-tag">#${r.index}</span> ${round} ${r.message_count}msg ${chars}</span>
            <span style="color:var(--muted);font-size:11px;">${esc(time)} · ${esc(shortModel)}</span>
            <button onclick="viewPrompt(${r.index})" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:2px 6px;font-size:11px;">查看</button>
          </div>`;
        }).concat(records.length > 3
          ? [`<div style="text-align:center;padding:4px 0;color:var(--accent);cursor:pointer;" onclick="viewPromptList()">查看全部 (${records.length}条) ▼</div>`]
          : []);
      })()},
      { title:'📤 LLM Raw Response', wide:false, items: (() => {
        const prs = info.response_summary || {};
        const records = prs.records || [];
        if (!records.length) return [];
        const recent = records.slice(-3);
        return recent.map(r => {
          const time = r.timestamp ? r.timestamp.split('T')[1].split('.')[0] : '--:--:--';
          const round = r.round_num !== undefined ? `R${r.round_num + 1}` : '';
          const chars = r.text_len ? `${r.text_len.toLocaleString()}字` : '';
          const ivLen = r.inner_voice_len ? ` (+${r.inner_voice_len} think)` : '';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0;">
            <span><span class="role-tag">#${r.index}</span> ${round} ${chars}${ivLen}</span>
            <span style="color:var(--muted);font-size:11px;">${esc(time)}</span>
            <button onclick="viewResponse(${r.index})" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:2px 6px;font-size:11px;">查看</button>
          </div>`;
        }).concat(records.length > 3
          ? [`<div style="text-align:center;padding:4px 0;color:var(--accent);cursor:pointer;" onclick="viewResponseList()">查看全部 (${records.length}条) ▼</div>`]
          : []);
      })()},
    ],
    // Row 3: Session | Long-term Memory
    [
      { title:'Recent Session', wide:false, items: (info.session_recent||[]).map(m => {
        const parts = m.parts || [];
        const ct = m.content_type || {};
        const roleTag = `<span class="role-tag ${esc(m.role)}">${esc(m.role)}</span>`;
        const thinkHtml = m.inner_voice ? `<div style="color:#888;font-style:italic;font-size:11px;padding:2px 4px;border-left:2px solid #888;margin:2px 0;">💭 ${expandable(m.inner_voice, 80)}</div>` : '';
        const textHtml = parts.map((p, i) => {
          let typeTag = '';
          if (ct.markdown && ct.markdown.includes(i)) typeTag = '<span class="type-tag">md</span>';
          if (ct.code && ct.code.includes(i)) typeTag = '<span class="type-tag">code</span>';
          return `${typeTag}${expandable(p.content, 90)}`;
        }).join('');
        const imgHtml = renderImages(m.content);
        return roleTag + thinkHtml + textHtml + imgHtml;
      })},
      { title:'Long-term Memory', wide:false, items: (info.lt_recent||[]).map(e =>
        `<span class="type-tag">${esc(e.memory_type||'?')}</span>${expandable(e.text, 90)}`
      )},
    ],
    // Row 4: Tools | Tool History | Consolidation
    [
      { title:'Tools', wide:true, items: (() => {
        const tools = info.tools || [];
        const showN = 4;  // 默认显示前 N 个
        const hasMore = tools.length > showN;
        const items = [];
        // 状态行
        items.push(
          (info.currently_executing||[]).length > 0
            ? `<div style="background:#e94560;color:#fff;padding:4px 8px;border-radius:4px;margin-bottom:6px;font-size:13px">
                 Executing: ${info.currently_executing.map(e=>esc(e)).join(', ')}
               </div>`
            : `<div style="color:var(--muted);padding:4px 8px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;">
                 <span>Idle</span><span style="font-size:11px;">${tools.length} tools</span>
               </div>`
        );
        // 默认可见的工具
        const visible = hasMore ? tools.slice(0, showN) : tools;
        visible.forEach(t => {
          items.push(
            `<div class="tool-card">
              <span class="tool-name">${esc(t.name)}</span>
              <span class="tool-desc">${esc(t.description)}</span>
              <div class="tool-params">${(t.parameters||[]).slice(0, 4).map(p =>
                `<span class="param-tag" title="${esc(p.description||'')}">${esc(p.name)}<i>${esc(p.type)}</i>${p.required?'*':''}</span>`
              ).join(' ')}${(t.parameters||[]).length > 4 ? `<span style="color:var(--muted);font-size:10px;"> +${t.parameters.length - 4} more</span>` : ''}</div>
            </div>`
          );
        });
        if (hasMore) {
          // 折叠的放在 hidden div
          const toolListId = 'tools-fold-' + Math.random().toString(36).slice(2, 8);
          let foldHtml = '';
          tools.slice(showN).forEach(t => {
            foldHtml += `<div class="tool-card">
              <span class="tool-name">${esc(t.name)}</span>
              <span class="tool-desc">${esc(t.description)}</span>
              <div class="tool-params">${(t.parameters||[]).slice(0, 4).map(p =>
                `<span class="param-tag" title="${esc(p.description||'')}">${esc(p.name)}<i>${esc(p.type)}</i>${p.required?'*':''}</span>`
              ).join(' ')}${(t.parameters||[]).length > 4 ? `<span style="color:var(--muted);font-size:10px;"> +${t.parameters.length - 4} more</span>` : ''}</div>
            </div>`;
          });
          items.push(
            `<div id="${toolListId}" style="display:none;">${foldHtml}</div>`,
            `<div onclick="var el=document.getElementById('${toolListId}');var show=el.style.display==='none';el.style.display=show?'block':'none';this.innerHTML=show?'▲ 收起':'▼ 展开全部 (${tools.length - showN} more)'" style="text-align:center;padding:4px 0;color:var(--accent);cursor:pointer;font-size:11px;">▼ 展开全部 (${tools.length - showN} more)</div>`
          );
        }
        return items;
      })()},
    ],
    // Row 5: Tool History | Consolidation
    [
      { title:'Tool History', wide:false, items: (info.tool_history||[]).map(t =>
        (t.error
          ? `<span class="tool-name">${esc(t.name)}</span> <span class="tool-args">${esc(JSON.stringify(t.args))}</span><br><span class="tool-error">✗ ${esc(t.error)}</span>`
          : `<span class="tool-name">${esc(t.name)}</span> <span class="tool-args">${esc(JSON.stringify(t.args))}</span><br><span class="tool-result">→ ${esc(trunc(t.result||'',120))}</span>`
        )
      )},
      { title:'Consolidation', wide:false, items: (info.consolidation_history||[]).map(c =>
        `<span class="type-tag">${esc(c.type||'?')}</span>${esc(trunc(c.content,100))}`
      )},
    ],
    // Row 6: Character Reflector
    [
      (() => {
        const ref = info.reflector_exists ? info : null;
        const items = [];

        // 状态行
        items.push(
          `<div class="row"><span class="label">Buffer</span><span class="value">${ref ? ref.reflector_buffer_size + '/50' : 'N/A'}</span></div>`,
          `<div class="row"><span class="label">上次反思</span><span class="value">${ref && ref.reflector_last_reflection_at ? new Date(ref.reflector_last_reflection_at * 1000).toLocaleTimeString() : '从未'}</span></div>`,
        );
        const locked = ref && ref.reflector_locked;
        items.push(
          `<div class="row"><span class="label">状态</span><span class="value ${locked ? 'warn' : 'ok'}">${locked ? '反思中...' : 'idle'}</span></div>`,
        );

        // 引擎连接时显示 state_history；否则显示旧 self_perception_history
        const engineConnected = info.personality_engine_exists;
        const hist = engineConnected
          ? (info.state_history || [])
          : ((ref && ref.self_perception_history) || []);
        const histLabel = engineConnected ? 'State 历史' : 'Self-Perception 历史';
        if (hist.length === 0) {
          items.push('<div class="empty" style="margin-top:4px">' + histLabel + ': 暂无' + (engineConnected ? '（见下方 PersonalityEngine 面板）' : '') + '</div>');
        } else {
          let histHtml = '<details style="margin-top:4px"><summary>' + histLabel + ' (' + hist.length + ')</summary>';
          histHtml += '<div style="max-height:200px;overflow-y:auto">';
          hist.reverse().forEach((h, i) => {
            const ts = new Date(h.timestamp * 1000).toLocaleString();
            const isLatest = i === 0;
            const bg = isLatest ? 'background:rgba(233,69,96,0.08);border-left:2px solid var(--accent);padding-left:6px' : '';
            histHtml += '<div class="list-item" style="' + bg + '">';
            histHtml += '<span style="color:var(--muted);font-size:11px">' + esc(ts) + '</span><br>';
            histHtml += '<details><summary style="cursor:pointer">' + esc(trunc(h.content, 60)) + '</summary>';
            histHtml += '<div style="white-space:pre-wrap;margin-top:3px">' + esc(h.content) + '</div>';
            histHtml += '</details></div>';
          });
          histHtml += '</div></details>';
          items.push(histHtml);
        }

        // 最近反思 Prompt
        if (ref && (ref.reflector_last_prompt_system || ref.reflector_last_prompt_user)) {
          let promptHtml = '<details style="margin-top:4px"><summary>最近反思 Prompt</summary>';
          if (ref.reflector_last_prompt_system) {
            promptHtml += '<div style="font-size:11px;color:var(--muted);margin-top:4px">System:</div>';
            promptHtml += '<div class="list-item" style="white-space:pre-wrap;max-height:120px;overflow-y:auto;font-size:11px">' + esc(trunc(ref.reflector_last_prompt_system, 400)) + '</div>';
          }
          if (ref.reflector_last_prompt_user) {
            promptHtml += '<div style="font-size:11px;color:var(--muted);margin-top:4px">User:</div>';
            promptHtml += '<div class="list-item" style="white-space:pre-wrap;max-height:120px;overflow-y:auto;font-size:11px">' + esc(trunc(ref.reflector_last_prompt_user, 400)) + '</div>';
          }
          // 调用结果
          if (ref.reflector_last_text_len !== undefined) {
            const ok = ref.reflector_last_success;
            promptHtml += '<div class="row" style="margin-top:4px"><span class="label">调用</span>';
            promptHtml += '<span class="value ' + (ok ? 'ok' : 'fail') + '">';
            promptHtml += (ok ? '成功' : '失败') + ' | ' + ref.reflector_last_duration_ms.toFixed(0) + 'ms | ' + ref.reflector_last_text_len + ' chars';
            promptHtml += '</span></div>';
          }
          promptHtml += '</details>';
          items.push(promptHtml);
        }

        return { title:'Character Reflector', wide:true, items: items };
      })()
    ],
    // Row 7: PersonalityEngine
    [
      (() => {
        if (!info.personality_engine_exists) return null;
        const items = [];

        // L2 Self
        items.push('<div class="row"><span class="label">L2 Self</span></div>');
        items.push('<div class="list-item" style="white-space:pre-wrap;max-height:80px;overflow-y:auto;font-size:11px">' + esc(info.self_l2 || '（未演化）') + '</div>');

        // L3 State
        items.push('<div class="row" style="margin-top:4px"><span class="label">L3 State</span></div>');
        items.push('<div class="list-item" style="white-space:pre-wrap;max-height:80px;overflow-y:auto;font-size:11px">' + esc(info.state_l3 || '（无）') + '</div>');

        // Awareness cooldown
        const now = Date.now() / 1000;
        const last = info.last_awareness_time || 0;
        const cooldownRemain = last ? Math.max(0, 3600 - (now - last)) : 0;
        const cooldownOk = cooldownRemain <= 0;
        items.push(
          '<div class="row" style="margin-top:4px"><span class="label">C9 冷却</span><span class="value ' + (cooldownOk ? 'ok' : 'warn') + '">' +
          (cooldownOk ? '就绪' : Math.ceil(cooldownRemain / 60) + 'min 剩余') + '</span></div>'
        );

        // State 历史
        const hist = info.state_history || [];
        if (hist.length === 0) {
          items.push('<div class="empty" style="margin-top:4px">State 历史: 暂无</div>');
        } else {
          let histHtml = '<details style="margin-top:4px"><summary>State 历史 (' + hist.length + ')</summary>';
          histHtml += '<div style="max-height:150px;overflow-y:auto">';
          [...hist].reverse().forEach((h, i) => {
            const ts = new Date(h.timestamp * 1000).toLocaleString();
            const bg = i === 0 ? 'background:rgba(233,69,96,0.08);border-left:2px solid var(--accent);padding-left:6px' : '';
            histHtml += '<div class="list-item" style="' + bg + '">';
            histHtml += '<span style="color:var(--muted);font-size:11px">' + esc(ts) + '</span><br>';
            histHtml += '<span style="font-size:11px">' + esc(trunc(h.content, 100)) + '</span>';
            histHtml += '</div>';
          });
          histHtml += '</div></details>';
          items.push(histHtml);
        }

        return { title:'PersonalityEngine', wide:true, items: items };
      })()
    ],
  ];

  let html = '';
  for (const row of cards) {
    for (const card of row) {
      if (!card) continue;
      let cls = card.wide ? 'card card-wide' : 'card';
      html += `<div class="${cls}"><h2>${card.title}</h2>`;
      if (card.rows) {
        for (const [label, value] of card.rows) {
          html += `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
        }
      }
      if (card.items) {
        if (card.items.length === 0) {
          html += '<div class="empty">暂无数据</div>';
        } else {
          for (const item of card.items) {
            html += `<div class="list-item">${item}</div>`;
          }
        }
      }
      html += '</div>';
    }
  }
  document.getElementById('grid').innerHTML = html;
}

let currentPromptIndex = null;
let promptCache = {};

async function viewPrompt(index) {
  currentPromptIndex = index;
  await loadPrompt(index);
  document.getElementById('prompt-overlay').classList.add('show');
}

function closePrompt() {
  document.getElementById('prompt-overlay').classList.remove('show');
}

async function loadPrompt(index) {
  let data = promptCache[index];
  if (!data) {
    try {
      const resp = await fetch('/debug/api/prompts/' + index);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      data = await resp.json();
      promptCache[index] = data;
    } catch(e) {
      document.getElementById('prompt-content').innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
      return;
    }
  }

  const time = data.timestamp ? data.timestamp.split('T')[1].split('.')[0] : '';
  document.getElementById('prompt-title').textContent =
    `📝 Prompt #${data.index}  第 ${data.round_num + 1} 轮  ${data.model}  ${time}`;

  // ── 左侧：消息列表（可折叠卡片）──
  let leftHtml = '<div style="overflow-y:auto;max-height:65vh;">';
  const msgs = data.messages || [];
  const msgCount = msgs.length;
  leftHtml += '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">';
  leftHtml += '消息列表 &nbsp;<span style="background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;">' + msgCount + '</span>';
  leftHtml += '</div>';
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    const role = m.role || '?';
    let content = m.content || '';
    if (Array.isArray(content)) {
      content = content.map(p => {
        if (p.type === 'text') return p.content || p.text || '';
        if (p.type === 'image_url') return '[图片]';
        return JSON.stringify(p);
      }).join('');
    }
    const len = content.length;
    const sizeStr = len >= 1024 ? (len / 1024).toFixed(1) + 'KB' : len + 'B';
    const roleClass = role === 'system' ? 'role-tag fail' : (role === 'user' ? 'role-tag user' : 'role-tag assistant');
    const roleLabel = {system:'System Prompt', user:'User', assistant:'Assistant', tool:'Tool'}[role] || role;
    const msgId = 'msg-' + data.index + '-' + i;
    // system 默认展开，其余折叠
    const isSystem = role === 'system';
    const display = isSystem ? 'block' : 'none';
    const arrow = isSystem ? '▼' : '▸';
    leftHtml += '<div style="border:1px solid var(--border);border-radius:4px;margin-bottom:6px;overflow:hidden;">';
    // header
    leftHtml += '<div onclick="toggleMsg(\'' + msgId + '\', this)" style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:rgba(255,255,255,0.03);cursor:pointer;user-select:none;">';
    leftHtml += '<span style="font-size:12px;"><span class="msg-arrow" style="display:inline-block;width:14px;text-align:center;color:var(--muted);">' + arrow + '</span> <span class="' + roleClass + '">' + esc(roleLabel) + '</span> <span style="color:var(--muted);font-size:10px;">' + sizeStr + '</span></span>';
    leftHtml += '<button onclick="event.stopPropagation();copyMsgContent(\'' + msgId + '\')" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:3px;padding:2px 6px;font-size:10px;" title="复制此消息">📋</button>';
    leftHtml += '</div>';
    // body
    leftHtml += '<div id="' + msgId + '" style="display:' + display + ';padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.15);max-height:300px;overflow-y:auto;">' + esc(content) + '</div>';
    leftHtml += '</div>';
  }
  leftHtml += '</div>';

  // ── 右侧：可折叠 Section 面板 ──
  let rightHtml = '<div style="overflow-y:auto;max-height:65vh;">';
  const tmpl = data.template_source;
  if (tmpl) {
    const sections = tmpl.sections || {};
    const secNames = Object.keys(sections);
    rightHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">';
    rightHtml += '<span style="font-size:12px;color:var(--muted);">模板: <b style="color:var(--text);">' + esc(tmpl.path) + '</b> &nbsp;<span style="background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;">' + secNames.length + ' sections</span></span>';
    rightHtml += '<button onclick="copyAllSections()" style="cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:3px;padding:3px 10px;font-size:11px;" title="复制所有 section 内容">复制全部</button>';
    rightHtml += '</div>';
    if (secNames.length) {
      let first = true;
      for (const [name, content] of Object.entries(sections)) {
        const secId = 'sec-' + data.index + '-' + name.replace(/[^a-zA-Z0-9]/g, '_');
        const size = (content || '').length;
        const sizeStr = size >= 1024 ? (size / 1024).toFixed(1) + 'KB' : size + 'B';
        const display = first ? 'block' : 'none';
        const arrow = first ? '▼' : '▸';
        rightHtml += '<div style="border:1px solid var(--border);border-radius:4px;margin-bottom:6px;overflow:hidden;">';
        // header — clickable toggle
        rightHtml += '<div onclick="toggleSection(\'' + secId + '\', this)" style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:rgba(255,255,255,0.03);cursor:pointer;user-select:none;">';
        rightHtml += '<span style="font-size:12px;"><span class="sec-arrow" style="display:inline-block;width:14px;text-align:center;color:var(--muted);">' + arrow + '</span> <span style="color:var(--accent);">' + esc(name) + '</span> <span style="color:var(--muted);font-size:10px;">' + sizeStr + '</span></span>';
        rightHtml += '<button onclick="event.stopPropagation();copySection(\'' + secId + '\')" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:3px;padding:2px 6px;font-size:10px;" title="复制此 section">📋</button>';
        rightHtml += '</div>';
        // body — collapsible
        rightHtml += '<div id="' + secId + '" style="display:' + display + ';padding:8px;font-size:11px;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.2);max-height:30vh;overflow-y:auto;">' + esc(content) + '</div>';
        rightHtml += '</div>';
        first = false;
      }
    }
  } else {
    rightHtml += '<div class="empty">模板文件不可用</div>';
  }
  rightHtml += '</div>';

  document.getElementById('prompt-content').innerHTML = leftHtml + rightHtml;

  // ── 底部：Tools 列表 ──
  const tools = data.tools;
  if (tools && tools.length > 0) {
    const toolsJSON = JSON.stringify(tools, null, 2);
    let toolsText = '';
    tools.forEach(t => {
      const fn = t.function || {};
      const name = fn.name || '?';
      const desc = fn.description || '';
      const params = fn.parameters || {};
      const props = params.properties || {};
      const required = params.required || [];
      const paramStrs = Object.entries(props).map(([k, v]) => {
        const req = required.includes(k) ? '*' : '';
        return k + ': ' + (v.type || 'string') + req;
      });
      toolsText += '[' + name + '] ' + desc + '\n';
      if (paramStrs.length) toolsText += '  参数: ' + paramStrs.join(', ') + '\n';
    });
    // 存入 hidden 元素供复制按钮引用
    const listEl = document.getElementById('prompt-tools-text');
    const jsonEl = document.getElementById('prompt-tools-json');
    if (listEl) listEl.textContent = toolsText;
    if (jsonEl) jsonEl.textContent = toolsJSON;

    let toolsHtml = '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px;">';
    toolsHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
    toolsHtml += '<span style="font-size:13px;color:var(--accent);font-weight:600;">Tools <span style="background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;">' + tools.length + '</span></span>';
    toolsHtml += '<span>';
    toolsHtml += '<button onclick="copyToolsText()" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:3px;padding:3px 10px;font-size:11px;margin-right:6px;">📋 复制列表</button>';
    toolsHtml += '<button onclick="copyToolsJSON()" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:3px;padding:3px 10px;font-size:11px;">📋 复制 JSON</button>';
    toolsHtml += '</span></div>';
    toolsHtml += '<div style="border:1px solid var(--border);border-radius:4px;overflow:hidden;">';
    tools.forEach((t, idx) => {
      const fn = t.function || {};
      const name = fn.name || '?';
      const desc = fn.description || '';
      const params = fn.parameters || {};
      const props = params.properties || {};
      const required = params.required || [];
      const bg = idx % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.1)';
      toolsHtml += '<div style="padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.04);background:' + bg + ';">';
      toolsHtml += '<div style="font-size:12px;font-weight:600;color:var(--warn);">' + esc(name) + '</div>';
      toolsHtml += '<div style="font-size:11px;color:var(--text);margin:2px 0;">' + esc(desc) + '</div>';
      if (Object.keys(props).length > 0) {
        const paramStrs = Object.entries(props).map(([k, v]) => {
          const req = required.includes(k) ? '<span style="color:var(--accent);" title="必需">*</span>' : '';
          const enumInfo = v.enum ? ' = ' + v.enum.join('|') : '';
          return '<span class="param-tag">' + esc(k) + req + '<i>' + (v.type || 'string') + enumInfo + '</i></span>';
        });
        toolsHtml += '<div style="margin-top:3px;">' + paramStrs.join(' ') + '</div>';
      }
      toolsHtml += '</div>';
    });
    toolsHtml += '</div></div>';
    document.getElementById('prompt-tools').innerHTML = toolsHtml;
  } else {
    document.getElementById('prompt-tools').innerHTML = '';
  }
}

function copyToolsJSON() {

function copyToolsText() {

}

function copyAllSections() {
  const sections = document.querySelectorAll('[id^="sec-"]');
  let all = '';
  sections.forEach(el => { all += el.textContent + '\n\n'; });
  copyToClipboard(all.trim());
  const btn = document.querySelector('#prompt-content button');

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function flashCopyFeedback(secId) {
  // 找到对应 section 的复制按钮
  const body = document.getElementById(secId);
  if (!body) return;
  const card = body.closest('div');
  if (!card) return;
  const btn = card.previousElementSibling?.querySelector('button');
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = orig; }, 1000);
  }
}

function navigatePrompt(delta) {
  const ps = (lastInfo && lastInfo.prompt_summary) ? lastInfo.prompt_summary : null;
  if (!ps || !ps.records || !ps.records.length) return;
  const indices = ps.records.map(r => r.index);
  const pos = indices.indexOf(currentPromptIndex);
  if (pos < 0 || (pos + delta) < 0 || (pos + delta) >= indices.length) return;
  viewPrompt(indices[pos + delta]);
}

async function copyPromptJSON() {
  if (!currentPromptIndex) return;
  let data = promptCache[currentPromptIndex];
  if (!data) {
    const resp = await fetch('/debug/api/prompts/' + currentPromptIndex);
    if (!resp.ok) return;
    data = await resp.json();
    promptCache[currentPromptIndex] = data;
  }
  const json = JSON.stringify(data.messages, null, 2);
  try {
    await navigator.clipboard.writeText(json);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function viewPromptList() {
  const ps = (lastInfo && lastInfo.prompt_summary) ? lastInfo.prompt_summary : null;
  if (ps && ps.records && ps.records.length) {
    viewPrompt(ps.records[ps.records.length - 1].index);
  }
}

// ---- Raw Response 查看器 ----
let currentResponseIndex = null;
let responseCache = {};

async function viewResponse(index) {
  currentResponseIndex = index;
  await loadResponse(index);
  document.getElementById('response-overlay').classList.add('show');
}

function closeResponse() {
  document.getElementById('response-overlay').classList.remove('show');
}

async function loadResponse(index) {
  let data = responseCache[index];
  if (!data) {
    try {
      const resp = await fetch('/debug/api/responses/' + index);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      data = await resp.json();
      responseCache[index] = data;
    } catch(e) {
      document.getElementById('response-raw').textContent = '加载失败: ' + e.message;
      return;
    }
  }

  const time = data.timestamp ? data.timestamp.split('T')[1].split('.')[0] : '';
  document.getElementById('response-title').textContent =
    `📤 Raw Response #${data.index}  第 ${data.round_num + 1} 轮  ${data.text_len} 字  ${time}`;

  // 显示 inner_voice
  const ivEl = document.getElementById('response-inner-voice');
  if (data.inner_voice) {
    ivEl.textContent = '💭 ' + data.inner_voice;
    ivEl.style.display = 'block';
  } else {
    ivEl.style.display = 'none';
  }

  document.getElementById('response-raw').textContent = data.raw_text || '(空)';
}

function navigateResponse(delta) {
  if (currentResponseIndex === null) return;
  const prs = (lastInfo && lastInfo.response_summary) ? lastInfo.response_summary : null;
  if (!prs || !prs.records || !prs.records.length) return;
  const records = prs.records;
  let idx = records.findIndex(r => r.index === currentResponseIndex);
  if (idx < 0) idx = records.length - 1;
  idx = (idx + delta + records.length) % records.length;
  viewResponse(records[idx].index);
}

function viewResponseList() {
  const prs = (lastInfo && lastInfo.response_summary) ? lastInfo.response_summary : null;
  if (prs && prs.records && prs.records.length) {
    viewResponse(prs.records[prs.records.length - 1].index);
  }
}

function showError(msg) {
  const b = document.getElementById('error-banner');
  b.textContent = msg;
  b.style.display = 'block';
}

async function poll() {
  if (paused) return;
  try {
    const resp = await fetch('/debug/api');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const info = await resp.json();
    render(info);
    pollInterval = POLL_MS;
  } catch(e) {
    showError('无法连接: ' + e.message);
    pollInterval = Math.min(pollInterval * 2, POLL_MAX_MS);
  }
  scheduleNext();
}

function scheduleNext() {
  if (timer) clearTimeout(timer);
  if (paused) return;
  timer = setTimeout(poll, pollInterval);
}

poll();

document.getElementById('pause-btn').onclick = () => {
  paused = !paused;
  const btn = document.getElementById('pause-btn');
  if (paused) {
    btn.textContent = '恢复';
    if (timer) { clearTimeout(timer); timer = null; }
  } else {
    btn.textContent = '暂停';
    poll();
  }
};

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-tasks').style.display = 'none';

async function loadDbPanel() {
  document.getElementById('db-updated').textContent = '加载中...';
  try {
    const [status, ltm, sessions, archive] = await Promise.all([
      fetch('/debug/api/db-status').then(r => r.json()),
      fetch('/debug/api/ltm?limit=200').then(r => r.json()),
      fetch('/debug/api/sessions').then(r => r.json()),
      fetch('/debug/api/archive?limit=100').then(r => r.json()),
    ]);
    document.getElementById('db-updated').textContent = '最后刷新: ' + new Date().toLocaleTimeString();
    renderDbPanels(status, ltm, sessions, archive);
  } catch (e) {
    document.getElementById('db-updated').textContent = '加载失败: ' + e.message;
  }
}

let _ltmData = { entries: [], total: 0 };
let _sessionData = [];
let _archiveData = { messages: [], has_more: false, total: 0 };

function renderDbPanels(status, ltm, sessions, archive) {
  _ltmData = ltm;
  _sessionData = sessions.sessions || [];
  _archiveData = archive || { messages: [], has_more: false, total: 0 };

  const ltmPanel = renderLtmPanel(status);
  const sessionPanel = renderSessionPanel(status);
  const archivePanel = renderArchivePanel(status);
  document.getElementById('db-panels').innerHTML = ltmPanel + sessionPanel + archivePanel;

  // 绑定搜索事件 — 纯 CSS 过滤，不重渲染
  document.getElementById('ltm-search')?.addEventListener('input', filterLtm);
  document.getElementById('ltm-type-filter')?.addEventListener('change', filterLtm);
  // 绑定归档面板事件
  document.getElementById('archive-search')?.addEventListener('input', filterArchive);
  document.getElementById('archive-role-filter')?.addEventListener('change', filterArchive);
  document.getElementById('archive-load-more-btn')?.addEventListener('click', loadMoreArchive);
}

async function refreshLtmKeepingFilters() {
  // 保存当前筛选状态
  const searchVal = document.getElementById('ltm-search')?.value || '';
  const typeVal = document.getElementById('ltm-type-filter')?.value || '';
  await loadDbPanel();
  // 恢复筛选
  const si = document.getElementById('ltm-search');
  const ti = document.getElementById('ltm-type-filter');
  if (si) si.value = searchVal;
  if (ti) ti.value = typeVal;
  // 重新执行筛选
  filterLtm();
}

function filterLtm() {
  const search = (document.getElementById('ltm-search')?.value || '').trim().toLowerCase();
  const type = document.getElementById('ltm-type-filter')?.value || '';
  const items = document.querySelectorAll('#ltm-list .db-item');
  items.forEach(item => {
    const text = item.querySelector('.text')?.textContent?.toLowerCase() || '';
    const tag = item.querySelector('.type-tag')?.textContent?.toLowerCase() || '';
    const matchSearch = !search || text.includes(search) || tag.includes(search);
    const matchType = !type || tag === type;
    item.style.display = matchSearch && matchType ? '' : 'none';
  });
}

          <button onclick="cancelLtmEdit('${editId}', '${textId}')" style="cursor:pointer;background:var(--border);color:var(--text);border:none;border-radius:3px;padding:1px 8px;font-size:10px;">取消</button>

    <div class="db-search">

      <select id="ltm-type-filter">
        <option value="">全部</option>
        <option value="fact">Fact</option>

        <option value="preference">Preference</option>
        <option value="event">Event</option>
        <option value="note">Note</option>
      </select>

    <div id="ltm-list" style="max-height:400px;overflow-y:auto;margin-bottom:8px;">
      ${rows || '<div class="empty">暂无条目</div>'}

      <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;">

function toggleDbCard(headerEl) {
  const body = headerEl.nextElementSibling;

  body.style.display = hidden ? '' : 'none';
  headerEl.textContent = (hidden ? '▼ ' : '▸ ') + headerEl.textContent.replace(/^[▼▸] /, '');
}

function startLtmEdit(editId, textId) {
  document.getElementById(textId).style.display = 'none';
  document.getElementById(editId).style.display = '';
  document.getElementById(editId + '-input').focus();
}

function cancelLtmEdit(editId, textId) {
  document.getElementById(textId).style.display = '';
  document.getElementById(editId).style.display = 'none';
}

async function saveLtmEdit(entryId, editId, textId) {
  const input = document.getElementById(editId + '-input');
  const newText = (input.value || '').trim();
  if (!newText) { alert('内容不能为空'); return; }
  try {
    const r = await fetch('/debug/api/ltm/' + encodeURIComponent(entryId), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: newText }),
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById(textId).textContent = newText;
      cancelLtmEdit(editId, textId);
    } else {
      alert('保存失败: ' + (d.error || 'unknown'));
    }
  } catch (e) { alert('保存失败: ' + e.message); }
}

async function deleteSelectedLtm() {
  const checked = document.querySelectorAll('.ltm-check:checked');
  if (checked.length === 0) { alert('请先选择要删除的条目'); return; }
  document.getElementById('confirm-title').textContent = '批量删除记忆';
  document.getElementById('confirm-msg').textContent = `确认删除 ${checked.length} 条记忆吗？此操作不可撤销。`;
  document.getElementById('confirm-yes-btn').onclick = async () => {
    closeConfirmModal();
    let deleted = 0;
    for (const cb of checked) {
      try {
        const r = await fetch('/debug/api/ltm/' + encodeURIComponent(cb.value), { method: 'DELETE' });
        const d = await r.json();
        if (d.ok) deleted++;
      } catch (e) { /* continue */ }
    }
    refreshLtmKeepingFilters();
  };
  document.getElementById('confirm-modal').classList.add('show');
}

  </div>`;
}

function renderArchivePanel(status) {
  const s = status.archive || {};
  const data = _archiveData;
  const rows = (data.messages || []).map(m => {
    const role = m.role || '?';
    const ts = m.timestamp ? (m.timestamp.slice(0, 16).replace('T', ' ')) : '';
    const parts = m.parts || [];
    let text = parts.map(p => p.content || '').join('');
    if (role === 'tool') {
      text = `<span class="tool-name">[${esc(m.name || 'tool')}]</span> ${esc(text.slice(0, 60))}`;
    } else {
      text = esc(text);
    }
    return `<div class="db-item">
      <span class="text">
        <span class="role-tag ${role}">${esc(role)}</span>
        <span style="font-size:10px;color:var(--muted)">${esc(ts)}</span>
        ${expandable(text, 80)}
      </span>
    </div>`;
  }).join('');

  return `<div class="card">
    <h2 style="cursor:pointer;user-select:none;" onclick="toggleDbCard(this)">▼ Message Archive (MongoDB)</h2>
    <div class="db-card-body">
    <div class="db-stat">
      条目: <b>${data.total}</b> &nbsp; MongoDB: ${ok(s.mongodb_ok)} &nbsp; session: <b>${esc(status.session?.current_id || 'default')}</b>
    </div>
    <div class="db-search">
      <input id="archive-search" placeholder="搜索消息内容...">
      <select id="archive-role-filter">
        <option value="">全部</option>
        <option value="user">user</option>
        <option value="assistant">assistant</option>
        <option value="tool">tool</option>
      </select>
    </div>
    <div style="max-height:400px;overflow-y:auto;margin-bottom:8px;" id="archive-list">
      ${rows || '<div class="empty">暂无消息</div>'}
    </div>
    <div style="display:flex;justify-content:space-between;">
      <button class="db-btn" id="archive-load-more-btn" ${data.has_more ? '' : 'disabled'}>加载更多</button>
      <button class="db-btn danger" onclick="confirmClearArchive()">清空全部</button>
    </div>
    </div>
  </div>`;
}

function filterArchive() {
  const search = (document.getElementById('archive-search')?.value || '').trim().toLowerCase();
  const role = document.getElementById('archive-role-filter')?.value || '';
  const items = document.querySelectorAll('#archive-list .db-item');
  items.forEach(item => {
    const text = item.textContent.toLowerCase();
    const hasRole = !role || (role === 'tool' ? text.includes('tool') : item.querySelector('.role-tag.' + role));
    item.style.display = (!search || text.includes(search)) && hasRole ? '' : 'none';
  });
}

async function loadMoreArchive() {
  const btn = document.getElementById('archive-load-more-btn');
  btn.disabled = true;
  btn.textContent = '加载中...';
  const messages = _archiveData.messages || [];
  const lastMsg = messages.length > 0 ? messages[messages.length - 1] : null;
  const lastId = lastMsg ? lastMsg._id : null;
  try {
    let url = '/debug/api/archive?limit=100';
    if (lastId) url += '&before=' + encodeURIComponent(lastId);
    const r = await fetch(url);
    const data = await r.json();
    _archiveData.messages = messages.concat(data.messages || []);
    _archiveData.has_more = data.has_more;
    _archiveData.total = data.total;
    loadDbPanel();
  } catch (e) {
    btn.textContent = '加载失败，重试';
    btn.disabled = false;
  }
}

}

// ═══════════════════════════════════════════════════════════════════
// TaskSystem Debug Tab — SSE 实时推送
// ═══════════════════════════════════════════════════════════════════

// ── 工具函数 ──

function truncate(s, n) {
  if (!s) return '';
  return s.length <= n ? s : s.slice(0, n - 1) + '…';
}

// ── vis-network 配置 ──

const STATUS_COLORS = {
  pending: '#9e9e9e',
  running: '#42a5f5',
  success: '#66bb6a',
  failed: '#ef5350',
  unrecoverable: '#c62828',
  skipped: '#e0e0e0',
  waiting_approval: '#ffa726',
  cancelled: '#bdbdbd',
};

const DAG_OPTIONS = {
  layout: { hierarchical: { direction: 'UD', levelSeparation: 80, nodeSpacing: 50, sortMethod: 'directed' } },
  edges: { arrows: 'to', color: '#aaa', width: 1 },
  nodes: { shape: 'box', font: { size: 11, color: '#ccc' }, margin: 6, widthConstraint: { maximum: 160 } },
  physics: false,
  interaction: { dragNodes: false, zoomView: false },
};

const dagInstances = new Map();  // taskId → { network, nodes: DataSet, edges: Array }

// ── node_id → vis.js 节点映射（initDAG 和 updateTaskCard 共用）──

function makeNodeItem(n) {
  return {
    id: n.node_id,
    label: truncate(n.node_id, 20),
    color: STATUS_COLORS[n.status] || '#9e9e9e',
    title: n.node_id + '\n' + (n.summary || '') + '\nattempt: ' + (n.attempt || 0),
  };
}

// ── dagInstances 生命周期 ──

function destroyDAG(taskId) {
  var inst = dagInstances.get(taskId);
  if (inst) { inst.network.destroy(); }
  dagInstances.delete(taskId);
}

function destroyAllDAGs() {
  dagInstances.forEach(function(inst) { inst.network.destroy(); });
  dagInstances.clear();
}

// ── DAG 图初始化 ──

function initDAG(container, taskId, nodes, edges) {
  const items = nodes.map(makeNodeItem);
  const edgeItems = (edges || []).map(function(e) { return { from: e[0], to: e[1] }; });
  const data = { nodes: new vis.DataSet(items), edges: new vis.DataSet(edgeItems) };
  const network = new vis.Network(container, data, DAG_OPTIONS);
  dagInstances.set(taskId, { network: network, nodes: data.nodes, edges: edges || [] });
  return network;
}

let taskES = null;
let taskReconnectTimer = null;
let taskReconnectDelay = 1000;

function connectTasksSSE() {
  if (taskES && taskES.readyState <= 1) return;
  if (taskReconnectTimer) { clearTimeout(taskReconnectTimer); taskReconnectTimer = null; }

  document.getElementById('tasks-stats').textContent = '运行中: ... | SSE: ⏳连接中';

  taskES = new EventSource('/debug/api/tasks/stream');

  taskES.addEventListener('snapshot', function(e) {
    destroyAllDAGs();  // SSE 重连/首次连接时销毁旧实例 + 清理，防止内存泄漏
    const tasks = JSON.parse(e.data);
    renderAllTasks(tasks);
    document.getElementById('tasks-stats').innerHTML =
      '运行中: ' + tasks.filter(t => t.status === 'running').length +
      ' | SSE: <span style="color:#66bb6a">●已连接</span>';
    taskReconnectDelay = 1000;
  });

  taskES.addEventListener('task_new', function(e) {
    const t = JSON.parse(e.data);
    insertTaskCard(t);
    updateTasksStats();
  });

  taskES.addEventListener('task_update', function(e) {
    const d = JSON.parse(e.data);
    updateTaskCard(d.task_id, d.status, d.nodes);
    updateTasksStats();
  });

  taskES.addEventListener('task_done', function(e) {
    const d = JSON.parse(e.data);
    moveTaskToDone(d.task_id, d.status, d.error);
    updateTasksStats();
  });

  taskES.addEventListener('node_update', function(e) {
    const d = JSON.parse(e.data);
    updateNodeInCard(d.task_id, d.node_id, d.status, d.attempt);
  });

  taskES.addEventListener('heartbeat', function(e) { /* silent */ });

  taskES.onerror = function() {
    document.getElementById('tasks-stats').innerHTML =
      '运行中: ... | SSE: <span style="color:#ef5350">●已断开</span> (重连中...)';
    taskES.close();
    taskES = null;
    taskReconnectTimer = setTimeout(function() {
      connectTasksSSE();
      taskReconnectDelay = Math.min(taskReconnectDelay * 2, 30000);
    }, taskReconnectDelay);
  };
}

// ── 渲染 ──

function renderAllTasks(tasks) {
  var active = document.getElementById('tasks-active');
  var doneList = document.getElementById('tasks-done-list');
  active.innerHTML = '';
  doneList.innerHTML = '';
  var hasDone = false;
  tasks.forEach(function(t) {
    if (t.status === 'running' || t.status === 'pending' || t.status === 'planning') {
      insertTaskCardDOM(active, t);
    } else {
      renderDoneRow(doneList, t);
      hasDone = true;
    }
  });
  document.getElementById('tasks-done-section').style.display = hasDone ? '' : 'none';
}

function insertTaskCard(t) {
  if (t.status === 'completed' || t.status === 'failed' || t.status === 'cancelled') {
    renderDoneRow(document.getElementById('tasks-done-list'), t);
    document.getElementById('tasks-done-section').style.display = '';
    return;
  }
  insertTaskCardDOM(document.getElementById('tasks-active'), t);
}

function insertTaskCardDOM(container, t) {
  var existing = document.getElementById('task-card-' + t.task_id);
  if (existing) existing.remove();
  var progress = 0;
  var nodes = t.nodes || [];
  if (nodes.length > 0) {
    var done = nodes.filter(function(n) { return n.status === 'success' || n.status === 'skipped'; }).length;
    progress = Math.round(done / nodes.length * 100);
  }
  var dagId = 'dag-' + t.task_id;
  var height = Math.min(400, Math.max(150, nodes.length * 60));
  var html = '<div class="task-card status-' + t.status + '" id="task-card-' + t.task_id + '">' +
    '<div class="task-header">' +
      '<span class="task-id">' + t.task_id + '</span>' +
      '<span class="task-status status-' + t.status + '">' + t.status.toUpperCase() + '</span>' +
    '</div>' +
    '<div class="task-meta">Replan: ' + (t.plan_version - 1) + '/' + t.plan_version +
    ' | 节点: ' + (nodes.length) + ' | 队列: ' + (t.mailbox_depth || 0) + '</div>' +
    '<div class="task-progress-bar"><div class="fill" style="width:' + progress + '%"></div></div>' +
    '<div class="task-dag" id="' + dagId + '" style="height:' + height + 'px;"></div>' +
  '</div>';
  container.insertAdjacentHTML('afterbegin', html);

  // 创建 vis-network 图
  if (nodes.length > 0) {
    initDAG(document.getElementById(dagId), t.task_id, nodes, t.edges || []);
  }
}

function updateTaskCard(taskId, newStatus, newNodes) {
  // 1. 更新 vis-network 图
  var inst = dagInstances.get(taskId);
  if (inst && newNodes && newNodes.length > 0) {
    var items = newNodes.map(makeNodeItem);
    inst.network.setData({ nodes: items, edges: inst.edges.map(function(e) { return { from: e[0], to: e[1] }; }) });
    inst.nodes = inst.network.body.data.nodes;  // setData 创建新 DataSet，必须同步引用
  }

  // 2. 更新 card DOM 元信息
  var card = document.getElementById('task-card-' + taskId);
  if (!card) return;
  var statusEl = card.querySelector('.task-status');
  if (statusEl) {
    statusEl.textContent = newStatus.toUpperCase();
    statusEl.className = 'task-status status-' + newStatus;
  }
  card.className = 'task-card status-' + newStatus;

  // 3. 更新进度条
  if (newNodes && newNodes.length > 0) {
    var done = newNodes.filter(function(n) { return n.status === 'success' || n.status === 'skipped'; }).length;
    var progress = Math.round(done / newNodes.length * 100);
    var fill = card.querySelector('.task-progress-bar .fill');
    if (fill) fill.style.width = progress + '%';
  }
}

function updateNodeInCard(taskId, nodeId, newStatus, attempt) {
  var inst = dagInstances.get(taskId);
  if (!inst) return;
  var color = STATUS_COLORS[newStatus] || '#9e9e9e';
  inst.nodes.update({ id: nodeId, color: color });  // 只更新颜色，title 由 initDAG/task_update 设置，此处保持不变
}

function moveTaskToDone(taskId, status, error) {
  destroyDAG(taskId);  // 销毁 Network 实例并清理，后续 node_update/task_update 自然 no-op

  var card = document.getElementById('task-card-' + taskId);
  if (!card) return;
  card.remove();
  var doneList = document.getElementById('tasks-done-list');
  var msg = status.toUpperCase();
  if (error) msg += ' — ' + error;
  var row = document.createElement('div');
  row.className = 'task-done-row';
  row.innerHTML = '<b>' + taskId + '</b>: ' + msg;
  doneList.insertBefore(row, doneList.firstChild);
  document.getElementById('tasks-done-section').style.display = '';
  updateTasksStats();
}

function renderDoneRow(container, t) {
  var msg = t.status.toUpperCase();
  if (t.error) msg += ' — ' + t.error;
  var row = document.createElement('div');
  row.className = 'task-done-row';
  row.innerHTML = '<b>' + t.task_id + '</b>: ' + msg;
  container.appendChild(row);
}

function updateTasksStats() {
  var active = document.getElementById('tasks-active');
  var cards = active.querySelectorAll('.task-card');
  document.getElementById('tasks-stats').innerHTML =
    '运行中: ' + cards.length + ' | SSE: <span style="color:#66bb6a">●已连接</span>';
}
</script>
