# Bandit 配置（F2，2026-08-11）— 受控门禁而非噪音源。
# 范围：生产 Python（core/ Module/ frontend_contract/ scripts/，排除测试 double）。
# 跳过项均有理由；未来专项清理后逐步启用（todo.md 记录）。
exclude_dirs:
  - tests
  - __pycache__
  - node_modules
exclude_paths:
  - "**/test_*.py"
  - "**/tests/**"
  - "**/conftest.py"
  - "**/_fake_*.py"
  - scripts/capture_ws_trace.py   # 已废弃历史脚本
skips:
  - B101   # assert——大量为测试/防御惯用；生产 assert（-O 下失效）另立专项清理
  - B311   # random 非密码学用途（时间/ID 生成）
  - B404   # subprocess import——B603/B607 已覆盖实际 shell 调用
  - B105   # 硬编码密码（测试密钥占位符）
  - B106   # 硬编码密码函数参数（同上）
  - B107   # 硬编码密码默认参数（同上）
  - B108   # 硬编码 /tmp 路径（脚本临时文件惯用）
  - B104   # 硬编码 IPv4 绑定（127.0.0.1 回环开发默认）
  - B110   # try-except-pass——部分为有意容错（逐处审后移除）
