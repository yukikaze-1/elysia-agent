[pytest]
# 收集范围（2026-09-17 Batch 2.2）：**显式排除 gitignored 的临时目录 `tmp/`**。
#
# 为什么需要：本仓没有 `testpaths`，pytest 从 rootdir 递归整个仓库——而 `tmp/` 是
# 各批次留下的草稿区（`.gitignore` 里）。于是**本地收集面比 CI 宽**：CI 是
# `git fetch --depth 1` 的干净 checkout，`tmp/` 根本不存在；本地却会把草稿区里
# 恰好叫 `test_*.py` 的文件一起收进来。
#
# 实测（2026-09-17）：`tmp/batch15/main-agent/b15_pytest_probe/` 下两个 Batch 1.5
# 遗留探针文件让本地收集数比 worktree 多 3～4 条，`make check-test-sets` 报
# 5931 vs 5951。同类残留还可能让 `make test-quick` 因**草稿文件**变红，
# 而 CI 全绿——正是"CI 与本地不一致"最难查的一种：判据两边不同源。
#
# 排除 `tmp/` 是正确取舍：它是**工作区草稿**，不是测试目录（已跟踪的测试全在
# `core/ / Module/ / frontend_contract/ / scripts/ / tests/` 五处，已核对）。
# 保留 pytest 默认的其余排除项，只追加 `tmp`。
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv tmp

# GR-15（Batch 19）：**未注册的 marker 一律拒答**。此前只有"缺分层 marker"被根
# conftest 的钩子挡住，而"带合法分层 marker + 拼错的附加 marker"仍会静默改变选择
# （例如 `real_mongoo` 让一个 real_mongo 用例悄悄掉出该档）。全仓 collect-only 实测
# 通过（6576 tests），故开启。新增 marker 必须同时登记进下面的 markers 列表。
addopts = --strict-markers
markers =
    unit:        纯函数/类测试，无 I/O，无 Agent 启动，无外部服务 mock
    service:     单模块测试，可能需要 mock，但不启动完整 Agent/不连真实 DB
    integration: 需要真实数据库（MongoDB/Milvus）或外部 API
    slow:        完整管线、端到端、或单测耗时 >1s
    external:    需要真实外部服务/凭据（真实 LLM/DB），离线门禁排除、独立 opt-in（F1）
    real_mongo:  真实 MongoDB 测试层（S2-R6-1）——须显式 ELYSIA_TEST_MONGODB_URI；
                 与 external 同标（默认任何档位都不跑），CI 用 -m real_mongo 单独起 job

filterwarnings =
    # F4（2026-08-11）：异步 coroutine 泄漏防线——"coroutine ... was never awaited"
    # 置 error（先修测试 double，不用全局 filter 忽略）。其余 RuntimeWarning 类别
    # 随 F1 warnings-as-errors 逐步扩大。
    error:coroutine .*was never awaited

# 全局保守超时（P2，2026-09-10）——需 pytest-timeout 插件（见 requirements.txt）。
# 目的：无界 `await` 回归成挂死时，本地 `make test-full` 不再永久挂起、CI 也不必苦等
# job 级 15–45 分钟超时。300s 是**每个测试**的上限，远超本仓最慢用例，保守安全。
#
# timeout_method=thread 而非默认的 signal：
#   - 跨平台：signal 走 SIGALRM（仅 Unix）；Windows 无 SIGALRM，显式 signal 会在运行期
#     崩（AttributeError: setitimer）。本仓跨平台（tzdata 即为 Windows 而设），故用 thread。
#   - 兜底更强：thread 对卡在不可中断 await / 阻塞 C 调用的用例同样能终止——超时即 dump
#     全线程栈后 os._exit(1)（代价：整轮 pytest 被终止，但 300s 阈值下只可能是真回归）。
#   - 实测有效：把 `await asyncio.sleep(30)` 植入测试，thread（与 signal）均在 3s 处捕获。
timeout = 300
timeout_method = thread
