# 所有后端 provider 的默认配置
# 优先级: env var > YAML (config.yaml) > 此文件默认值
# 用户可通过 .env 或 config.yaml 覆盖，无需修改代码

llm:
  deepseek:
    # S2-H7：内置默认值必须写在配置里——留空会让 `AsyncOpenAI(base_url="")` 拿到空串
    # （SDK 只对 None 回退），env 一空就**静默降级**成"连不上"。
    # 该值与 Module/llm/config.py 及 core/config/app_config.py 的声明一致。
    base_url: "https://api.deepseek.com"
    url_key: "DEEPSEEK_URL"
    beta_url: ""
    beta_url_key: "DEEPSEEK_BETA_URL"
    env_key: "DEEPSEEK_API_KEY"
    supports_prefix: true
    supports_multimodal: false
    # S2-H3：DeepSeek 风格顶层 `thinking` 字段（{"thinking": {"type": ...}}）。
    # 声明为 true 才会把调用点的 extra_body 发出去；未声明的 provider 由后端**丢弃**
    # 该键并打一次 warning——严格 OpenAI 风格 API 遇未知顶层参数直接 400，会让该
    # provider 上 100% 回合失败，而日志只显示 GENERATION_PROVIDER_UNAVAILABLE。
    # 未声明 = "不表态"（交给 provider 自己的默认），不是"显式关闭"。
    supports_thinking: true
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（DeepSeek V4 系列文档口径 128K）——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 131072
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
  openai:
    base_url: "https://api.openai.com/v1"   # 与 Module/embedding/config.py 一致
    url_key: "OPENAI_URL"
    env_key: "OPENAI_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    supports_thinking: false
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（gpt-4o 上下文 128K）——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 128000
    models: ["gpt-4", "gpt-4o", "gpt-5"]
  ollama:
    base_url: "http://localhost:11434/v1"   # ollama 的 OpenAI 兼容端点
    url_key: "OLLAMA_URL"
    env_key: ""
    local: true
    supports_prefix: false
    supports_multimodal: false
    supports_thinking: false
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（本地模型常见默认（qwen2.5:3b 的 num_ctx 默认 8K））——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 8192
    models: ["qwen2.5:3b"]
  gemini:
    base_url: ""
    url_key: "GEMINI_URL"
    env_key: "GEMINI_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    supports_thinking: false
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（Gemini 1.5/2.x 长上下文 1M）——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 1048576
    models: []
  mimo:
    base_url: ""
    url_key: "MIMO_URL"
    env_key: "MIMO_API_KEY"
    supports_prefix: false
    supports_multimodal: true
    supports_thinking: false
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（厂商未公开，取保守值）——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 32768
    models: ["mimo-v2.5", "mimo-v2.5-pro"]
  custom:
    base_url: ""
    url_key: ""
    env_key: "CUSTOM_LLM_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    supports_thinking: false
    # S2-H9：prompt 预算的来源（token）。预算 = 本值 × 0.75（留输出/工具/
    # 估算误差的余量）。**估算值**（自定义端点未知，取保守值）——若与实际不符请直接改这里，
    # 它只影响截断时机，不影响正确性。
    context_window: 32768
    models: []

tts:
  gpt-sovits:
    # S2-H7：与 Module/tts/gpt_sovits.py 的 DEFAULT_BASE_URL 一致——那个默认值此前是
    # **死代码**（注册表把空串直接传进后端，把它覆盖了）。
    base_url: "http://localhost:9880"
    url_key: "GPT_SOVITS_URL"
    env_key: ""
    local: true
    models: ["default"]
  custom:
    base_url: ""
    url_key: ""
