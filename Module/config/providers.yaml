# 所有后端 provider 的默认配置
# 优先级: env var > YAML (config.yaml) > 此文件默认值
# 用户可通过 .env 或 config.yaml 覆盖，无需修改代码

llm:
  deepseek:
    # S2-H7：内置默认值必须写在配置里——留空会让 `AsyncOpenAI(base_url="")` 拿到空串
    # （SDK 只对 None 回退），env 一空就**静默降级**成"连不上"。
    # 该值与 Module/llm/config.py 及 core/config/app_config.py 的声明一致。
    base_url: "https://api.deepseek.com"
    url_key: "DEEPSEEK_URL"
    beta_url: ""
    beta_url_key: "DEEPSEEK_BETA_URL"
    env_key: "DEEPSEEK_API_KEY"
    supports_prefix: true
    supports_multimodal: false
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
  openai:
    base_url: "https://api.openai.com/v1"   # 与 Module/embedding/config.py 一致
    url_key: "OPENAI_URL"
    env_key: "OPENAI_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    models: ["gpt-4", "gpt-4o", "gpt-5"]
  ollama:
    base_url: "http://localhost:11434/v1"   # ollama 的 OpenAI 兼容端点
    url_key: "OLLAMA_URL"
    env_key: ""
    local: true
    supports_prefix: false
    supports_multimodal: false
    models: ["qwen2.5:3b"]
  gemini:
    base_url: ""
    url_key: "GEMINI_URL"
    env_key: "GEMINI_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    models: []
  mimo:
    base_url: ""
    url_key: "MIMO_URL"
    env_key: "MIMO_API_KEY"
    supports_prefix: false
    supports_multimodal: true
    models: ["mimo-v2.5", "mimo-v2.5-pro"]
  custom:
    base_url: ""
    url_key: ""
    env_key: "CUSTOM_LLM_API_KEY"
    supports_prefix: false
    supports_multimodal: false
    models: []

tts:
  gpt-sovits:
    # S2-H7：与 Module/tts/gpt_sovits.py 的 DEFAULT_BASE_URL 一致——那个默认值此前是
    # **死代码**（注册表把空串直接传进后端，把它覆盖了）。
    base_url: "http://localhost:9880"
    url_key: "GPT_SOVITS_URL"
    env_key: ""
    local: true
    models: ["default"]
  custom:
    base_url: ""
    url_key: ""
    env_key: "CUSTOM_TTS_API_KEY"
    models: []
  minimax:
    base_url: ""
    url_key: "MINIMAX_TTS_URL"
    env_key: "MINIMAX_API_KEY"
    models: ["speech-2.8-hd"]

stt:
  sensevoice:
    base_url: ""
    url_key: "SENSEVOICE_URL"
    env_key: ""
    local: true
    models: ["sense-voice"]
  openai:
    base_url: ""
    url_key: "OPENAI_STT_URL"
    env_key: "OPENAI_API_KEY"
    models: []
  deepgram:
    base_url: ""
    url_key: "DEEPGRAM_URL"
    env_key: "DEEPGRAM_API_KEY"
    models: []
  custom:
    base_url: ""
    url_key: ""
    env_key: "CUSTOM_STT_API_KEY"
    models: []

embedding:
  huggingface:
    base_url: ""
    url_key: ""
    env_key: ""
  openai:
    base_url: ""
    url_key: "OPENAI_API_BASE"
    env_key: "OPENAI_API_KEY"

database:
  milvus:
    base_url: ""
  mongodb:
    base_url: ""
