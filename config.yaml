# Elysia Agent 配置文件
# 优先级: 环境变量 > config.yaml > 代码默认值
# 敏感信息（API key 等）必须通过 .env 环境变量设置，不要写在此文件

# ---- Agent 核心 ----
agent:
  character: character/elysia/config.yaml  # 角色配置文件路径
  user_name: 妖梦                      # 用户名（注入 system prompt）
  max_pending_messages: 32             # 等待队列上限

# ---- LLM ----
llm:
  # 格式: <provider>/<model>。provider 由 Module/llm/registry.py 解析
  model: deepseek/deepseek-v4-flash

# ---- 记忆 ----
memory:
  # ltm_enable_eviction: true            # 是否启用数量驱逐（开发阶段可设为 false 避免丢失测试记忆）
  session_max_messages: 50             # SessionMemory deque 上限（LLM 上下文窗口）

# ---- HTTP 服务器 ----
server:
  # 默认绑定回环地址：本地开发开箱即用（无 token 也安全）。远程暴露用环境变量
  # SERVER_HOST=0.0.0.0 覆盖（无需改本文件），并配 AGENT_ACCESS_TOKEN 或
  # ALLOW_INSECURE_REMOTE=1 通过 bind 安全检查（review 复核 #1：非回环绑定必须配业务 token）。
  host: 127.0.0.1
  port: 8765
  # auth_token: 通过环境变量 SERVER_AUTH_TOKEN 设置。
  #   设置后，/shutdown /restart /tools /tools/reload 需要
  #   Authorization: Bearer <token> 请求头。
  # attachment_sig_secret: 通过环境变量 ATTACHMENT_SIG_SECRET 设置。
  #   批次 7 附件签名密钥（HMAC 签名 /api/attachments/{id} 下载 URL）。
  #   AGENT_ACCESS_TOKEN 配置而本密钥未配置时，上传响应省略 signedUrl（fail-closed）。
  # max_request_bytes: 业务请求体上限，默认 64MB；0 = 不限（None/缺省回落 64MB）。
  image_max_mb: 10                     # 图片上传上限 (MB)
  image_allowed_types:
    - image/png
    - image/jpeg
    - image/gif
    - image/webp
  # D6b: 公开入口限流（类别 → 每分钟上限，0 关闭；单进程语义——多实例部署需自建共享后端）。
  #   env 覆盖: RATE_LIMIT_WS_PER_MIN / RATE_LIMIT_MESSAGES_PER_MIN /
  #   RATE_LIMIT_PROVIDER_TEST_PER_MIN / RATE_LIMIT_UPLOAD_PER_MIN /
  #   RATE_LIMIT_SEARCH_PER_MIN / RATE_LIMIT_TOOLS_PER_MIN
  rate_limit_ws_per_min: 120              # WS 建连/IP
  rate_limit_messages_per_min: 120        # 文本/语音消息/IP（generation 高成本）
  rate_limit_provider_test_per_min: 30    # /api/providers/test + switch_model
  rate_limit_upload_per_min: 60           # /api/uploads + /api/images
  rate_limit_search_per_min: 60           # /api/search/messages
  rate_limit_tools_per_min: 120           # 工具审批

# ---- TTS 语音合成 ----
tts:
  enabled: true
  # 格式: <provider>/<model>
  #   minimax/speech-2.8-hd  → MiniMax API（音色映射: Module/tts/minimax_voices.yaml）
  #   gpt-sovits/default      → GPT-SoVits（音色映射: Module/tts/gpt_sovits_voices.yaml）
  model: minimax/speech-2.8-hd
  # MiniMax 每分钟最大合成请求数（滑动窗口），0 关闭限速。默认 20（MiniMax 基础配额）
  # rate_limit_rpm: 20

# ---- STT 语音识别 ----
stt:
  enabled: true
  model: sensevoice/sense-voice        # SenseVoice（需本地服务运行）

# ---- 唤醒词 ----
wake_word:
  enabled: false                       # 语音唤醒开关（需 STT + openWakeWord 模型）

# ---- Live2D ----
live2d:
  static_image: "/static/Elysia.png"  # Live2D 未启用时的静态立绘

# ---- 数据库 ----
database:
  mongodb_uri: mongodb://localhost:27017  # MongoDB 连接串（env: MONGODB_URI）
  milvus_uri: http://localhost:19530     # Milvus 服务端点（env: MILVUS_URI）
  milvus_token: ""                        # Milvus 认证令牌（env: MILVUS_TOKEN）
  db_name: default                       # MongoDB 数据库名

# ---- Vision ----
vision:
  model: mimo/mimo-v2.5               # describe_image 工具使用的视觉模型
