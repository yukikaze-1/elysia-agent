# Elysia Agent 配置文件
# 环境变量 > YAML > 默认值

agent:
  character: character/elysia.yaml
  user_name: 妖梦
  max_pending_messages: 32

llm:
  model: deepseek/deepseek-v4-flash

memory:
  session_max_messages: 200

server:
  host: 0.0.0.0
  port: 8765
  image_max_mb: 10                  # 图片上传上限 (MB)
  image_allowed_types:              # 允许的 MIME 类型
    - image/png
    - image/jpeg
    - image/gif
    - image/webp

tts:
  enabled: true
  model: gpt-sovits/default

stt:
  enabled: true
  model: sensevoice/sense-voice

wake_word:
  enabled: false

live2d:
  static_image: "/static/Elysia.png"

# Vision model for describe_image tool (e.g., mimo/mimo-v2.5)
vision:
  model: mimo/mimo-v2.5
