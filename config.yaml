# Elysia Agent 配置文件
# 环境变量 > YAML > 默认值

agent:
  character: character/elysia.yaml
  user_name: 妖梦
  max_pending_messages: 32

llm:
  model: deepseek/deepseek-v4-flash

memory:
  session_max_messages: 20

server:
  host: 0.0.0.0
  port: 8765

tts:
  enabled: true
  model: gpt-sovits/default

stt:
  enabled: true
  model: sensevoice/sense-voice

wake_word:
  enabled: false
